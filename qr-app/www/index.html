<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>كاشير QR</title><meta name="theme-color" content="#0d6b57"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="كاشير QR">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app — scanner deck on top, receipt strip in the middle, total bar fixed at the bottom */
:root{
  --bg:#eef2f0; --paper:#ffffff; --ink:#0f2a24; --muted:#5d716b; --line:#d5dfdb;
  --accent:#0d6b57; --accent-ink:#ffffff; --beam:#f2a516; --danger:#b3261e; --chip:#e3ece8;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1513; --paper:#14211e; --ink:#e4efeb; --muted:#90a59f; --line:#26372f;
  --accent:#3fbf9f; --accent-ink:#06201a; --beam:#f5b53a; --danger:#f2867e; --chip:#1c2d29; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1513; --paper:#14211e; --ink:#e4efeb; --muted:#90a59f; --line:#26372f;
  --accent:#3fbf9f; --accent-ink:#06201a; --beam:#f5b53a; --danger:#f2867e; --chip:#1c2d29; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-block:16px 210px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hbtns{display:flex;gap:8px}
.hbtn{background:var(--chip);color:var(--ink);padding:8px 12px;font-size:14px;font-weight:600}
h1{font-family:var(--f-display);font-size:22px;margin:0;font-weight:700}
.sub{color:var(--muted);font-size:13px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px}
button:focus-visible,input:focus-visible{outline:3px solid var(--beam);outline-offset:2px}
.deck{background:var(--ink);color:var(--bg);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.viewfinder{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:12px;overflow:hidden;background:#000}
.viewfinder video{width:100%;height:100%;object-fit:cover;display:block}
.viewfinder .beam{position:absolute;inset-inline:10%;height:2px;background:var(--beam);box-shadow:0 0 12px var(--beam);top:50%;animation:sweep 1.8s ease-in-out infinite alternate}
@keyframes sweep{from{top:20%}to{top:80%}}
@media (prefers-reduced-motion:reduce){.viewfinder .beam{animation:none}}
.scanbtn{background:var(--beam);color:#1d1400;font-family:var(--f-display);font-size:18px;font-weight:700;padding:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.ghost{background:transparent;color:inherit;border:1px solid color-mix(in srgb,currentColor 35%,transparent);padding:10px 12px;font-size:14px;flex:1}
.manual{display:flex;gap:8px}
.manual input{flex:1;min-width:0}
input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.status{font-size:13px;min-height:1.4em;color:color-mix(in srgb,var(--bg) 80%,transparent)}
.status.err{color:#ffb4ab}
/* receipt */
.receipt{background:var(--paper);border-radius:4px 4px 0 0;padding:16px 16px 22px;position:relative;
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,radial-gradient(circle 6px at 8px 100%,transparent 6px,#000 6.5px) bottom/16px 8px repeat-x;
  mask:linear-gradient(#000 0 0) top/100% calc(100% - 8px) no-repeat,radial-gradient(circle 6px at 8px 100%,transparent 6px,#000 6.5px) bottom/16px 8px repeat-x}
.rhead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:4px}
.rhead b{font-family:var(--f-display);font-size:16px}
.link{background:none;color:var(--danger);font-size:13px;padding:4px}
ul{list-style:none;margin:0;padding:0}
li.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.price{font-variant-numeric:tabular-nums;font-weight:600;text-align:left;direction:ltr}
.meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:30px;height:30px;background:var(--chip);color:var(--ink);font-size:18px;line-height:1}
.qty span{min-width:1.5em;text-align:center;color:var(--ink);font-weight:600}
.tag{background:var(--chip);color:var(--muted);font-size:11px;padding:2px 8px;border-radius:99px}
.empty{color:var(--muted);text-align:center;padding:24px 8px;line-height:1.7}
.totalbar{position:fixed;inset:auto 0 0 0;background:var(--accent);color:var(--accent-ink);
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
.totalbar .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.trow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.finish{background:var(--accent-ink);color:var(--accent);padding:12px;font-weight:700;font-size:16px;font-family:var(--f-display);width:100%}
.totalbar small{display:block;opacity:.8;font-size:12px}
.total{font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr}
.total span{font-size:15px;font-weight:500;margin-inline-start:6px}
/* sheet for new product */
.sheet{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet form{background:var(--paper);color:var(--ink);width:100%;max-width:520px;border-radius:18px 18px 0 0;display:flex;flex-direction:column;gap:12px;max-height:92%;overflow-y:auto;box-sizing:border-box;
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h2{font-family:var(--f-display);font-size:18px;margin:0}
.code{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted);direction:ltr;text-align:right;overflow-wrap:anywhere}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.primary{background:var(--accent);color:var(--accent-ink);padding:14px;font-weight:600;flex:2}
.secondary{background:var(--chip);color:var(--ink);padding:14px;flex:1}
.addbtn{background:var(--accent);color:var(--accent-ink)!important;padding:8px 12px!important;font-weight:600;font-size:14px!important}
.sheet label{min-width:0}.sheet input{width:100%;box-sizing:border-box}
.panel{background:var(--paper);color:var(--ink);width:100%;max-width:520px;max-height:88%;display:flex;flex-direction:column;gap:12px;border-radius:18px 18px 0 0;box-sizing:border-box;
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px}
.plist{overflow-y:auto;min-height:0;flex:1}
.prodrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:right;background:none;color:var(--ink);padding:12px 0;border-radius:0;border-bottom:1px dashed var(--line)}
.pc{font-family:ui-monospace,monospace;font-size:11px;color:var(--muted);direction:ltr;text-align:right;overflow-wrap:anywhere}
.sm{font-size:12px;color:var(--muted)}
.dayhead{display:flex;justify-content:space-between;gap:12px;font-weight:700;padding:14px 0 6px;font-family:var(--f-display);font-size:14px;color:var(--accent)}
.invbody{padding:6px 0 12px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:6px;border-bottom:1px dashed var(--line)}
.il{display:flex;justify-content:space-between;gap:12px}
.il span:last-child{direction:ltr;font-variant-numeric:tabular-nums}
.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);padding:14px;flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips:empty{display:none}
.chip{background:var(--chip);color:var(--ink);padding:6px 12px;font-size:13px;border-radius:99px}
select{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);flex:1;min-width:0}
.bk{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--chip);border-radius:12px;padding:10px 12px;font-size:13px}
.bystudio{background:var(--chip);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:13px;margin:6px 0}
.bystudio b{font-family:var(--f-display);font-size:13px}
.toast{position:fixed;bottom:calc(150px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:0 auto;width:fit-content;max-width:90%;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:30}
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}
</style></head><body>

<div class="app">
  <header>
    <div><h1>كاشير QR</h1><span class="sub" id="catCount">الكتالوج: —</span></div>
    <div class="hbtns"><button class="hbtn" id="prodBtn" type="button">المنتجات</button><button class="hbtn" id="histBtn" type="button">السجل</button></div>
  </header>
  <div class="bk" id="bkBanner" hidden><span id="bkText"></span><button class="hbtn" id="bkBtn" type="button">نسخة احتياطية</button></div>

  <section class="deck" aria-label="المسح">
    <div class="viewfinder" id="vf" hidden>
      <video id="video" playsinline muted></video>
      <div class="beam"></div>
    </div>
    <button class="scanbtn" id="scanBtn" type="button">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg>
      افتح الكاميرا وامسح
    </button>
    <input type="file" id="fileIn" accept="image/*" capture="environment" hidden>
    <div class="row">
      <button class="ghost" id="photoBtn" type="button">تصوير صورة</button>
      <button class="ghost" id="galleryBtn" type="button">صورة من المعرض</button>
    </div>
    <form class="manual" id="manualForm">
      <input id="manualCode" placeholder="أو اكتب الكود يدويًا" autocomplete="off">
      <button class="ghost" style="flex:0 0 auto" type="submit">إضافة</button>
    </form>
    <div class="status" id="status" role="status"></div>
  </section>

  <section class="receipt" aria-label="الفاتورة">
    <div class="rhead"><b>الفاتورة</b><div class="row" style="flex:0 0 auto;gap:10px;align-items:center"><button class="link addbtn" id="addManualBtn" type="button">+ بند يدوي</button><button class="link" id="clearBtn" type="button">مسح الكل</button></div></div>
    <ul id="list"></ul>
  </section>
</div>

<div class="totalbar">
  <div class="in">
    <div class="trow">
      <div><small>المجموع</small><small id="countLbl">0 منتج</small></div>
      <div class="total" id="total">0.00<span>درهم</span></div>
    </div>
    <button class="finish" id="finishBtn" type="button">إنهاء الفاتورة وحفظها</button>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <form id="prodForm">
    <h2 id="sheetTitle">منتج جديد</h2>
    <div class="code" id="sheetCode"></div>
    <label>اسم المنتج بالعربي<input id="pName" required autocomplete="off"></label>
    <label>السعر (درهم)<input id="pPrice" required inputmode="decimal" autocomplete="off"></label>
    <div class="row">
      <button class="primary" type="submit">حفظ وإضافة للفاتورة</button>
      <button class="secondary" type="button" id="cancelSheet">إلغاء</button>
    </div>
  </form>
</div>
<div class="sheet" id="mSheet" hidden>
  <form id="mForm">
    <h2>إضافة بند يدوي</h2>
    <label>اسم البند<input id="mName" required autocomplete="off"></label>
    <div class="row">
      <label style="flex:1">السعر (درهم)<input id="mPrice" required inputmode="decimal" autocomplete="off"></label>
      <label style="flex:1">الكمية<input id="mQty" required inputmode="decimal" value="1" autocomplete="off"></label>
    </div>
    <div class="row">
      <button class="primary" type="submit">إضافة للفاتورة</button>
      <button class="secondary" type="button" id="mCancel">إلغاء</button>
    </div>
  </form>
</div>
<div class="sheet" id="pSheet" hidden>
  <div class="panel" role="dialog" aria-label="المنتجات">
    <div class="ph"><h2>المنتجات المحفوظة</h2><button class="secondary" style="flex:0 0 auto;padding:8px 14px" id="pClose" type="button">إغلاق</button></div>
    <input id="pFilter" placeholder="ابحث بالاسم أو الكود" autocomplete="off">
    <div class="plist" id="pList"></div>
  </div>
</div>
<div class="sheet" id="eSheet" hidden>
  <form id="eForm">
    <h2>تعديل المنتج</h2>
    <div class="code" id="eCode"></div>
    <label>الاسم<input id="eName" required autocomplete="off"></label>
    <label>السعر (درهم)<input id="ePrice" required inputmode="decimal" autocomplete="off"></label>
    <div class="row">
      <button class="primary" type="submit">حفظ</button>
      <button class="danger" type="button" id="eDelete">حذف المنتج</button>
      <button class="secondary" type="button" id="eCancel">إلغاء</button>
    </div>
  </form>
</div>
<div class="sheet" id="hSheet" hidden>
  <div class="panel" role="dialog" aria-label="سجل الفواتير">
    <div class="ph"><h2>سجل الفواتير</h2><button class="secondary" style="flex:0 0 auto;padding:8px 14px" id="hClose" type="button">إغلاق</button></div>
    <input id="hSearch" placeholder="ابحث: صنف، مورد، استديو، ملاحظة" autocomplete="off">
    <div class="row" style="flex-wrap:nowrap"><select id="hStudio" aria-label="الاستديو"></select><select id="hMonth" aria-label="الفترة"></select></div>
    <div class="sub" id="hToday"></div>
    <div class="sub" id="hSum" style="font-weight:600;color:var(--ink)"></div>
    <div class="plist" id="hList"></div>
    <div class="row">
      <button class="secondary" style="font-size:13px;padding:10px" id="expCsv" type="button">تصدير Excel</button>
      <button class="secondary" style="font-size:13px;padding:10px" id="expBk" type="button">نسخة احتياطية</button>
      <button class="secondary" style="font-size:13px;padding:10px" id="impBtn" type="button">استرجاع</button>
    </div>
    <input type="file" id="importIn" accept=".json,application/json" hidden>
  </div>
</div>
<div class="sheet" id="fSheet" hidden>
  <form id="fForm">
    <h2 id="fTitle">إنهاء الفاتورة</h2>
    <div class="sub" id="fSummary"></div>
    <label>الاستديو (اختياري)<input id="fStudio" autocomplete="off" placeholder="مثال: استديو 3"></label>
    <div class="chips" id="fStudioChips"></div>
    <label>المورد / المحل (اختياري)<input id="fStore" autocomplete="off"></label>
    <div class="chips" id="fStoreChips"></div>
    <label>ملاحظة (اختياري)<input id="fNote" autocomplete="off"></label>
    <div class="row">
      <button class="primary" id="fSave" type="submit">حفظ الفاتورة</button>
      <button class="secondary" type="button" id="fCancel">إلغاء</button>
    </div>
  </form>
</div>
<div class="sheet" id="lSheet" hidden>
  <form id="lForm">
    <h2>تعديل البند</h2>
    <label>الاسم<input id="lName" required autocomplete="off"></label>
    <div class="row">
      <label style="flex:1">السعر (درهم)<input id="lPrice" required inputmode="decimal" autocomplete="off"></label>
      <label style="flex:1">الكمية<input id="lQty" required inputmode="decimal" autocomplete="off"></label>
    </div>
    <div class="row">
      <button class="primary" type="submit">حفظ</button>
      <button class="danger" type="button" id="lDelete">حذف البند</button>
      <button class="secondary" type="button" id="lCancel">إلغاء</button>
    </div>
  </form>
</div>
<div class="toast" id="toast" hidden></div><div class="toast" id="toast" hidden></div>

<script>
(function(){var u=["jsQR.js","https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js","https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"],i=0;
function go(){if(i>=u.length)return;var s=document.createElement("script");s.src=u[i++];s.onerror=go;document.head.appendChild(s)}go()})();
</script>
<script>
const $ = id => document.getElementById(id);
const CUR = "درهم";
const ls = {get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

// ---------- catalog (kept on this phone) ----------
let catalog = ls.get("qr_catalog", {});
function updCount(){$("catCount").textContent="الكتالوج: "+Object.keys(catalog).length+" منتج"}
async function saveProduct(code,name,price){catalog[code]={name,price};ls.set("qr_catalog",catalog);updCount()}
updCount();

// ---------- cart ----------
let cart = ls.get("qr_cart", null);
let isExample = false;
if(!cart){cart=[{code:"ex1",name:"مياه معدنية 1.5 لتر",price:2.5,qty:2},{code:"ex2",name:"خبز عربي",price:4,qty:1}];isExample=true}
function fmt(n){return n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function render(){
  const ul=$("list"); ul.textContent="";
  if(!cart.length){const li=document.createElement("li");li.className="empty";li.textContent="الفاتورة فاضية. اضغط «افتح الكاميرا وامسح» ووجّه الكاميرا على كود المنتج.";ul.append(li)}
  cart.forEach((it,i)=>{
    const li=document.createElement("li");li.className="item";
    const n=document.createElement("div");n.className="name";n.textContent=it.name;
    if(isExample){const t=document.createElement("span");t.className="tag";t.textContent="مثال";n.append(" ",t)}
    const p=document.createElement("div");p.className="price";p.textContent=fmt(it.price*it.qty);
    const m=document.createElement("div");m.className="meta";
    const q=document.createElement("div");q.className="qty";
    const minus=document.createElement("button");minus.type="button";minus.textContent="−";minus.setAttribute("aria-label","إنقاص");
    const plus=document.createElement("button");plus.type="button";plus.textContent="+";plus.setAttribute("aria-label","زيادة");
    const s=document.createElement("span");s.textContent=it.qty;
    minus.onclick=()=>{it.qty--;if(it.qty<=0)cart.splice(i,1);save()};
    plus.onclick=()=>{it.qty++;save()};
    q.append(plus,s,minus);
    const unit=document.createElement("span");unit.textContent="× "+fmt(it.price)+" "+CUR;
    m.append(q,unit);
    if(!isExample){const ed=document.createElement("button");ed.type="button";ed.className="link";ed.style.color="var(--accent)";ed.textContent="تعديل";ed.onclick=()=>openLine(i);m.append(ed)}
    li.append(n,p,m);ul.append(li);
  });
  const total=cart.reduce((a,b)=>a+b.price*b.qty,0), count=cart.reduce((a,b)=>a+b.qty,0);
  $("total").firstChild.nodeValue=fmt(total);
  $("countLbl").textContent=count+" منتج";
}
function save(){if(!isExample)ls.set("qr_cart",cart);render()}
function addToCart(code,name,price){
  if(isExample){cart=[];isExample=false}
  const ex=cart.find(c=>c.code===code);
  let ln=ex;if(ex)ex.qty++;else{ln={code,name,price,qty:1};cart.push(ln)}
  save(); toast((ln.qty>1?"➕ ":"✅ ")+name+" × "+ln.qty+" = "+fmt(ln.price*ln.qty)+" "+CUR); beep(); try{vfHit(ln)}catch(e){}
  if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}
}
$("clearBtn").onclick=()=>{
  const b=$("clearBtn");
  if(b.dataset.confirm){cart=[];isExample=false;save();delete b.dataset.confirm;b.textContent="مسح الكل";return}
  b.dataset.confirm=1;b.textContent="متأكد؟ اضغط تاني";setTimeout(()=>{delete b.dataset.confirm;b.textContent="مسح الكل"},3000);
};

// ---------- parse QR text ----------
function parse(text){
  text=text.trim();
  try{const j=JSON.parse(text);if(j&&typeof j==="object"){

async function startLive(){

  catch(e){camError(e);return}

      const now=Date.now();

  $("lSheet").hidden=true;save();
};
const dayKey=ts=>{const d=new Date(ts);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
const monthKey=ts=>{const d=new Date(ts);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
const monthLabel=k=>{const [y,m]=k.split("-");return new Date(+y,+m-1,1).toLocaleDateString("ar-EG-u-nu-latn",{month:"long",year:"numeric"})};
const NOSTUDIO="بدون استديو";
let hLimit=60;
function fillFilters(){
  const sales=getSales();
  const ms=[...new Set(sales.map(s=>monthKey(s.ts)))].sort().reverse();
  const st=[...new Set(sales.map(s=>(s.studio||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ar"));
  const cm=$("hMonth").value,cs=$("hStudio").value;
  const mk=(sel,v,t)=>{const o=document.createElement("option");o.value=v;o.textContent=t;sel.append(o)};
  $("hMonth").textContent="";$("hStudio").textContent="";
  mk($("hMonth"),"","كل الفترات");ms.forEach(k=>mk($("hMonth"),k,monthLabel(k)));
  mk($("hStudio"),"","كل الاستديوهات");st.forEach(v=>mk($("hStudio"),v,v));
  if(st.length&&sales.some(s=>!(s.studio||"").trim()))mk($("hStudio"),"__none",NOSTUDIO);
  $("hMonth").value=ms.includes(cm)?cm:"";
  $("hStudio").value=[...$("hStudio").options].some(o=>o.value===cs)?cs:"";
}
function filtered(){
  const q=$("hSearch").value.trim().toLowerCase(),m=$("hMonth").value,st=$("hStudio").value;
  return getSales().slice().reverse().filter(s=>{
    if(m&&monthKey(s.ts)!==m)return false;
    const sv=(s.studio||"").trim();
    if(st==="__none"){if(sv)return false}else if(st&&sv!==st)return false;
    if(q&&![s.studio,s.store,s.note,...s.items.map(i=>i.name)].join(" ").toLowerCase().includes(q))return false;
    return true;
  });
}
function emptyMsg(box,t){const d=document.createElement("div");d.className="empty";d.textContent=t;box.append(d)}
function renderHistory(){
  const box=$("hList");box.textContent="";
  const all=getSales(),list=filtered();
  const td=all.filter(s=>dayKey(s.ts)===dayKey(Date.now()));
  $("hToday").textContent="اليوم: "+(td.length?td.length+" فاتورة — "+fmt(td.reduce((a,s)=>a+s.total,0))+" "+CUR:"مفيش فواتير لسه");
  $("hSum").textContent=list.length?"المحدد: "+list.length+" فاتورة — "+fmt(list.reduce((a,s)=>a+s.total,0))+" "+CUR:"";
  if(!all.length){emptyMsg(box,"لسه مفيش فواتير محفوظة. اضغط «إنهاء الفاتورة وحفظها» بعد كل عملية شراء.");return}
  if(!list.length){emptyMsg(box,"مفيش فواتير بالفلتر ده.");return}
  // total per studio for the current selection
  const per={};list.forEach(s=>{const k=(s.studio||"").trim()||NOSTUDIO;per[k]=(per[k]||0)+s.total});
  const ents=Object.entries(per).sort((a,b)=>b[1]-a[1]);
  if(ents.length>1||ents[0][0]!==NOSTUDIO){
    const bs=document.createElement("div");bs.className="bystudio";
    const t=document.createElement("b");t.textContent="الإجمالي لكل استديو";bs.append(t);
    ents.forEach(([k,v])=>{const l=document.createElement("div");l.className="il";const a=document.createElement("span");a.style.direction="rtl";a.textContent=k;const b=document.createElement("span");b.textContent=fmt(v)+" "+CUR;l.append(a,b);bs.append(l)});
    box.append(bs);
  }
  const shown=list.slice(0,hLimit);
  const groups=[];
  shown.forEach(s=>{const k=dayKey(s.ts);let g=groups[groups.length-1];if(!g||g.k!==k){g={k,ts:s.ts,list:[],sum:0};groups.push(g)}g.list.push(s);g.sum+=s.total});
  groups.forEach(g=>{
    const h=document.createElement("div");h.className="dayhead";
    const dt=document.createElement("span");dt.textContent=new Date(g.ts).toLocaleDateString("ar-EG-u-nu-latn",{weekday:"long",day:"numeric",month:"long"});
    const sm=document.createElement("span");sm.textContent=fmt(g.sum)+" "+CUR;sm.style.direction="ltr";
    h.append(dt,sm);box.append(h);
    g.list.forEach(s=>{
      const row=document.createElement("button");row.type="button";row.className="prodrow";
      const n=document.createElement("div");n.className="name";
      n.textContent="فاتورة #"+s.no+" · "+new Date(s.ts).toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit"});
      const pr=document.createElement("div");pr.className="price";pr.textContent=fmt(s.total)+" "+CUR;
      const c=document.createElement("div");c.className="sm";
      c.textContent=[s.items.reduce((a,i)=>a+i.qty,0)+" منتج",(s.studio||"").trim(),(s.store||"").trim()].filter(Boolean).join(" · ");
      row.append(n,pr,c);
      const body=document.createElement("div");body.className="invbody";body.hidden=true;
      s.items.forEach(i=>{const l=document.createElement("div");l.className="il";
        const a=document.createElement("span");a.style.direction="rtl";a.textContent=i.name+" × "+i.qty;
        const b=document.createElement("span");b.textContent=fmt(i.price*i.qty);l.append(a,b);body.append(l)});
      if(s.note){const nt=document.createElement("div");nt.textContent="ملاحظة: "+s.note;body.append(nt)}
      const acts=document.createElement("div");acts.className="row";acts.style.gap="16px";
      const edit=document.createElement("button");edit.type="button";edit.className="link";edit.style.color="var(--accent)";edit.textContent="تعديل الاستديو والمورد";
      edit.onclick=()=>openFinish("edit",s);
      const del=document.createElement("button");del.type="button";del.className="link";del.textContent="حذف الفاتورة";
      del.onclick=()=>{
        if(del.dataset.confirm){ls.set("qr_sales",getSales().filter(x=>sid(x)!==sid(s)));refreshHistory();return}
        del.dataset.confirm=1;del.textContent="متأكد؟ اضغط تاني";setTimeout(()=>{delete del.dataset.confirm;del.textContent="حذف الفاتورة"},3000);
      };
      acts.append(edit,del);body.append(acts);
      row.onclick=()=>{body.hidden=!body.hidden};
      box.append(row,body);
    });
  });
  if(list.length>hLimit){const m=document.createElement("button");m.type="button";m.className="secondary";m.style.cssText="width:100%;margin-top:10px;padding:12px";
    m.textContent="عرض المزيد ("+(list.length-hLimit)+" فاتورة)";m.onclick=()=>{hLimit+=60;renderHistory()};box.append(m)}
}
function refreshHistory(){fillFilters();renderHistory()}
const resetLimit=()=>{hLimit=60;renderHistory()};
$("hSearch").oninput=resetLimit;$("hMonth").onchange=resetLimit;$("hStudio").onchange=resetLimit;
$("histBtn").onclick=()=>{$("hSearch").value="";hLimit=60;refreshHistory();$("hSheet").hidden=false};
$("hClose").onclick=()=>{$("hSheet").hidden=true};

// ---------- export (Excel/CSV) and backup ----------
const pad2=n=>String(n).padStart(2,"0");
const stamp=()=>{const d=new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())};
const dstr=ts=>{const d=new Date(ts);return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+" "+pad2(d.getHours())+":"+pad2(d.getMinutes())};
function saveFile(blob,name){
  const fb=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
  const C=window.Capacitor;
  if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.Filesystem&&C.Plugins.Share){
    const fr=new FileReader();
    fr.onload=()=>{const b64=String(fr.result).split(",")[1];
      C.Plugins.Filesystem.writeFile({path:name,data:b64,directory:"CACHE"}).then(r=>C.Plugins.Share.share({title:name,dialogTitle:name,url:r.uri})).catch(()=>toast("تعذر حفظ الملف"))};
    fr.readAsDataURL(blob);return;
  }
  fb();
}
function exportCsv(){
  const list=filtered().slice().reverse();
  if(!list.length){toast("مفيش فواتير للتصدير");return}
  const esc=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const rows=[["التاريخ","رقم الفاتورة","الاستديو","المورد","الصنف","الكمية","سعر الوحدة","الإجمالي","ملاحظة"]];
  list.forEach(s=>s.items.forEach(i=>rows.push([dstr(s.ts),s.no,s.studio||"",s.store||"",i.name,i.qty,i.price,round2(i.price*i.qty),s.note||""])));
  const csv="\uFEFF"+rows.map(r=>r.map(esc).join(",")).join("\r\n");
  saveFile(new Blob([csv],{type:"text/csv;charset=utf-8"}),"purchases-"+stamp()+".csv");
  toast("جهّزت ملف Excel ("+list.length+" فاتورة)");
}
function exportBackup(){
  const data={app:"qr-cashier",v:1,exported:Date.now(),catalog,sales:getSales(),inv_no:ls.get("qr_inv_no",0)};
  saveFile(new Blob([JSON.stringify(data)],{type:"application/json"}),"qr-cashier-backup-"+stamp()+".json");
  ls.set("qr_last_backup",Date.now());checkBackup();toast("جهّزت النسخة الاحتياطية");
}
function checkBackup(){
  const n=getSales().length,last=ls.get("qr_last_backup",0),old=!last||Date.now()-last>7*86400000;
  const b=$("bkBanner");b.hidden=!(n>=3&&old);
  if(!b.hidden)$("bkText").textContent=last?"آخر نسخة احتياطية من "+Math.floor((Date.now()-last)/86400000)+" يوم":"لسه ما عملتش نسخة احتياطية لفواتيرك";
}
$("expCsv").onclick=exportCsv;$("expBk").onclick=exportBackup;$("bkBtn").onclick=exportBackup;
$("impBtn").onclick=()=>$("importIn").click();
$("importIn").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(!d||d.app!=="qr-cashier")throw new Error("bad");
    let np=0,ns=0;
    Object.entries(d.catalog||{}).forEach(([c,p])=>{if(p&&p.name&&isFinite(Number(p.price))){catalog[c]={name:String(p.name),price:Number(p.price)};np++}});
    const sales=getSales(),have=new Set(sales.map(sid));
    (d.sales||[]).forEach(s=>{
      if(!s||!isFinite(Number(s.ts))||!Array.isArray(s.items)||have.has(sid(s)))return;
      const items=s.items.map(i=>({name:String(i.name),price:Number(i.price),qty:Number(i.qty)})).filter(i=>isFinite(i.price)&&isFinite(i.qty));
      sales.push({no:s.no,ts:Number(s.ts),total:round2(items.reduce((a,i)=>a+i.price*i.qty,0)),studio:String(s.studio||""),store:String(s.store||""),note:String(s.note||""),items});
      have.add(sid(s));ns++;
    });
    sales.sort((a,b)=>a.ts-b.ts);
    ls.set("qr_catalog",catalog);ls.set("qr_sales",sales);ls.set("qr_inv_no",Math.max(ls.get("qr_inv_no",0),Number(d.inv_no)||0));
    updCount();refreshHistory();checkBackup();toast("اتسترجع: "+np+" منتج و"+ns+" فاتورة جديدة");
  }catch(err){toast("الملف ده مش نسخة احتياطية صالحة")}
};
let tt;function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,1800)}
checkBackup();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
render();
</script>
