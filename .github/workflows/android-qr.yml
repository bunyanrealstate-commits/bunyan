name: Build QR Cashier APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['qr-app/**','.github/workflows/android-qr.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qr-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Bundle the QR reader so the app works offline
        run: cp node_modules/jsqr/dist/jsQR.js www/jsQR.js && cp node_modules/@zxing/library/umd/index.min.js www/zxing.min.js
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#0d6b57' --iconBackgroundColorDark '#0d6b57'
      - run: npx cap sync android
      - name: Camera permission
        run: sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Increase versionCode on every build
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Lock portrait
        run: sed -i 's/<activity /<activity android:screenOrientation="portrait" /' android/app/src/main/AndroidManifest.xml
      - name: Use fixed signing key (so updates install over the old app)
        run: |
          cat >> android/app/build.gradle <<'GEOF'
          android {
            signingConfigs { fixed { storeFile file("${rootDir}/../../keystore/debug.keystore"); storePassword "android"; keyAlias "androiddebugkey"; keyPassword "android" } }
            buildTypes { debug { signingConfig signingConfigs.fixed } }
          }
          GEOF
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: QR-Cashier-APK
          path: qr-app/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to branch apk-qr
        run: |
          mkdir /tmp/out && cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/out/QR-Cashier.apk
          cd /tmp/out && git init -q -b apk-qr && git config user.name github-actions && git config user.email actions@github.com
          git add . && git commit -q -m "Build APK" && git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git apk-qr
