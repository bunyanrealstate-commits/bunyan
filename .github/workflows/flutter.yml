name: Build Bunyan (Flutter)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['bunyan_app/**','.github/workflows/flutter.yml']
permissions: { contents: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.24.5, cache: true }
      - name: Create platform folders + settings
        working-directory: bunyan_app
        run: |
          pip install -q fonttools brotli && python3 tool/fonts.py ../rental-tracker.html fonts
          flutter create --org com.bunyan --project-name bunyan --platforms android,ios,web . >/dev/null
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $M || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET" />\n    <application#' $M
          sed -i 's#android:label="bunyan"#android:label="بنيان"#' $M
          cp android_overrides/MainActivity.kt android/app/src/main/kotlin/com/bunyan/bunyan/MainActivity.kt
          # ML Kit (قراية الهوية): بنستخدم الحروف اللاتيني بس — باقي اللغات مش موجودة
          printf '%s\n' '-dontwarn com.google.mlkit.vision.text.chinese.**' '-dontwarn com.google.mlkit.vision.text.devanagari.**' '-dontwarn com.google.mlkit.vision.text.japanese.**' '-dontwarn com.google.mlkit.vision.text.korean.**' >> android/app/proguard-rules.pro
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml';s=open(p).read()
          f='<intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="bnyapp"/></intent-filter>'
          if 'bnyapp' not in s: s=s.replace('</activity>',f+'</activity>',1)
          if 'REQUEST_INSTALL_PACKAGES' not in s: s=s.replace('<application','<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <uses-permission android:name="android.permission.UPDATE_PACKAGES_WITHOUT_USER_ACTION"/>\n    <application',1)
          if 'UpdRx' not in s: s=s.replace('</application>','<receiver android:name=".UpdRx" android:exported="false"/></application>',1)
          for perm in ['POST_NOTIFICATIONS','SCHEDULE_EXACT_ALARM','USE_EXACT_ALARM','RECEIVE_BOOT_COMPLETED','VIBRATE','WAKE_LOCK']:
              if 'android.permission.'+perm not in s: s=s.replace('<application','<uses-permission android:name="android.permission.'+perm+'"/>\n    <application',1)
          if 'ScheduledNotificationReceiver' not in s: s=s.replace('</application>','<receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"/><receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/><action android:name="android.intent.action.MY_PACKAGE_REPLACED"/><action android:name="android.intent.action.QUICKBOOT_POWERON"/><action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/></intent-filter></receiver></application>',1)
          if 'com.bunyan.furnished' not in s: s=s.replace('<queries>','<queries><package android:name="com.bunyan.furnished"/>',1) if '<queries>' in s else s.replace('</manifest>','<queries><package android:name="com.bunyan.furnished"/></queries></manifest>',1)
          open(p,'w').write(s)
          PY
          # البصمة (local_auth) محتاجة ثيم AppCompat + dependency
          for f in android/app/src/main/res/values/styles.xml android/app/src/main/res/values-night/styles.xml; do [ -f $f ] && sed -i 's#parent="@android:style/Theme.Light.NoTitleBar"#parent="Theme.AppCompat.Light.NoActionBar"#; s#parent="@android:style/Theme.Black.NoTitleBar"#parent="Theme.AppCompat.NoActionBar"#' $f || true; done
          grep -q 'USE_BIOMETRIC' android/app/src/main/AndroidManifest.xml || sed -i 's#<application#<uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          mkdir -p ~/.android && cp ../keystore/debug.keystore ~/.android/debug.keystore
          # توقيع ثابت لكل النسخ (علشان التحديث يتسطّب فوق القديم)
          python3 - <<'PY'
          import os,re
          ks=os.path.abspath('../keystore/debug.keystore')
          for p in ['android/app/build.gradle','android/app/build.gradle.kts']:
              if not os.path.exists(p): continue
              s=open(p).read()
              if p.endswith('.kts'):
                  cfg='signingConfigs {\n        create("fixed") {\n            storeFile = file("%s")\n            storePassword = "android"\n            keyAlias = "androiddebugkey"\n            keyPassword = "android"\n        }\n    }\n    buildTypes {'%ks
                  s=s.replace('buildTypes {',cfg,1)
                  s=re.sub(r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)','signingConfig = signingConfigs.getByName("fixed")',s)
              else:
                  cfg="signingConfigs {\n        fixed {\n            storeFile file('%s')\n            storePassword 'android'\n            keyAlias 'androiddebugkey'\n            keyPassword 'android'\n        }\n    }\n    buildTypes {"%ks
                  s=s.replace('buildTypes {',cfg,1)
                  s=re.sub(r'signingConfig\s*=?\s*signingConfigs\.debug','signingConfig signingConfigs.fixed',s)
              if 'coreLibraryDesugaringEnabled' not in s:
                  if p.endswith('.kts'):
                      s=s.replace('compileOptions {','compileOptions {\n        isCoreLibraryDesugaringEnabled = true',1)
                      s+='\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")\n    implementation("androidx.appcompat:appcompat:1.7.0")\n}\n'
                  else:
                      s=s.replace('compileOptions {','compileOptions {\n        coreLibraryDesugaringEnabled true',1)
                      s+="\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'\n    implementation 'androidx.appcompat:appcompat:1.7.0'\n}\n"
              open(p,'w').write(s); print('patched',p)
          PY
          grep -n "signingConfig" android/app/build.gradle* || true
          flutter pub get
      - name: Analyze
        working-directory: bunyan_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib 2>&1 | tee /tmp/an.log || true
      - name: Test (كل الصفحات + عقد PDF)
        working-directory: bunyan_app
        run: mkdir -p build && (flutter test test/ct_pdf_test.dart test/ct_tpl_test.dart test/pages_test.dart test/sig_test.dart > /tmp/test.log 2>&1 && echo OK > /tmp/test.ok || true); grep -B2 -A25 "EXCEPTION\|Expected\|Error:" /tmp/test.log | head -80; tail -5 /tmp/test.log; test -f /tmp/test.ok
      - name: Build APK
        working-directory: bunyan_app
        run: flutter build apk --release --build-number=${{ github.run_number }} 2>&1 | tee /tmp/build.log; test ${PIPESTATUS[0]} -eq 0
      - name: Build Hakim APK (نسخة حكيم — تطبيق منفصل)
        continue-on-error: true
        working-directory: bunyan_app
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/main.apk
          for f in android/app/build.gradle android/app/build.gradle.kts; do [ -f $f ] && sed -i -E 's#(applicationId\s*=?\s*)"com\.bunyan\.bunyan"#\1"com.bunyan.hakim"#' $f || true; done
          grep -n applicationId android/app/build.gradle* || true
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="بنيان"#android:label="بنيان حكيم"#; s#android:scheme="bnyapp"#android:scheme="bnyhakim"#' $M
          flutter build apk --release --dart-define=HAKIM=true --build-number=${{ github.run_number }} 2>&1 | tail -5; test ${PIPESTATUS[0]} -eq 0
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/hakim.apk
          # نرجّع الإعدادات للنسخة العادية (عشان بناء الويب)
          for f in android/app/build.gradle android/app/build.gradle.kts; do [ -f $f ] && sed -i 's#"com.bunyan.hakim"#"com.bunyan.bunyan"#' $f || true; done
          sed -i 's#android:label="بنيان حكيم"#android:label="بنيان"#; s#android:scheme="bnyhakim"#android:scheme="bnyapp"#' $M
      - name: Save logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/log && cp /tmp/build.log /tmp/an.log /tmp/test.log /tmp/log/ 2>/dev/null || true
          cd /tmp/log && git init -q -b apk-flutter-log && git config user.name gh && git config user.email gh@github.com
          git add . && git commit -q -m log && git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git apk-flutter-log
      - name: Publish APK to branch apk-flutter
        run: |
          mkdir /tmp/out && (cp /tmp/main.apk /tmp/out/Bunyan.apk 2>/dev/null || cp bunyan_app/build/app/outputs/flutter-apk/app-release.apk /tmp/out/Bunyan.apk); cp /tmp/hakim.apk /tmp/out/Hakim.apk 2>/dev/null || true
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1); $BT/apksigner verify --print-certs /tmp/out/Bunyan.apk | head -5 > /tmp/out/cert.txt || true; $BT/aapt dump badging /tmp/out/Bunyan.apk | head -2 >> /tmp/out/cert.txt || true; $BT/aapt dump badging /tmp/out/Hakim.apk | head -2 >> /tmp/out/cert.txt || true && echo "{\"code\":${{ github.run_number }}}" > /tmp/out/version.json
          cp /tmp/an.log /tmp/out/analyze.log || true; cp bunyan_app/build/ct_test.pdf /tmp/out/ct_test.pdf || true; cp bunyan_app/build/ct_ar.pdf bunyan_app/build/ct_en.pdf bunyan_app/build/ct_bi.pdf bunyan_app/build/sig.png /tmp/out/ || true; cp /tmp/test.log /tmp/out/test.log || true
          cd /tmp/out && git init -q -b apk-flutter && git config user.name gh && git config user.email gh@github.com
          git add . && git commit -q -m "Bunyan Flutter APK" && git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git apk-flutter
      - name: Build web (للآيفون والكمبيوتر)
        continue-on-error: true
        working-directory: bunyan_app
        run: |
          flutter build web --release --no-web-resources-cdn --base-href /bunyan/app/ 2>&1 | tail -5
          cd /tmp && rm -rf pub && git clone -q --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git pub && cd pub
          git config user.name gh && git config user.email gh@github.com
          rm -rf docs/app && mkdir -p docs/app && cp -r $GITHUB_WORKSPACE/bunyan_app/build/web/. docs/app/
          git add docs/app && git commit -q -m "Bunyan Flutter web build ${{ github.run_number }}" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
