name: Auto-fix (Gemini)
on:
  schedule: [{cron: '17 */6 * * *'}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Need secrets
        id: s
        env: {G: '${{ secrets.GEMINI_KEY }}', D: '${{ secrets.DATA_TOKEN }}'}
        run: if [ -n "$G" ] && [ -n "$D" ]; then echo ok=1 >> $GITHUB_OUTPUT; else echo "add secrets GEMINI_KEY and DATA_TOKEN"; fi
      - if: steps.s.outputs.ok == '1'
        uses: actions/setup-node@v4
        with: { node-version: 20 }
      - if: steps.s.outputs.ok == '1'
        run: |
          git clone -q https://x-access-token:${{ secrets.DATA_TOKEN }}@github.com/bunyanrealstate-commits/bunyan-data2 /tmp/data
          npm i --no-save acorn playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          DATA_DIR=/tmp/data GEMINI_KEY='${{ secrets.GEMINI_KEY }}' NODE_PATH=$PWD/node_modules node tools/autofix.js
          if [ -f .autofix-msg ]; then
            git config user.name "bunyan-autofix"; git config user.email "autofix@users.noreply.github.com"
            git add rental-tracker.html docs tools/autofix-log.json tools/baseline.json
            git commit -q -F .autofix-msg && rm .autofix-msg && git push -q
          else git add tools/autofix-log.json 2>/dev/null; git diff --cached --quiet || (git config user.name "bunyan-autofix"; git config user.email "autofix@users.noreply.github.com"; git commit -qm "autofix log" && git push -q); fi
