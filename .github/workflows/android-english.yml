name: Build English Coach APK (offline AI)
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['english-app/**','.github/workflows/android-english.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: english-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#2747C9' --iconBackgroundColorDark '#2747C9'
      - run: npx cap sync android
      - name: Download on-device AI model (Gemma 3 1B, int4)
        run: |
          mkdir -p android/app/src/main/assets/model
          curl -fL --retry 3 -o android/app/src/main/assets/model/gemma3-1b-it-int4.task \
            https://huggingface.co/aquhm/gemma3-1b-it-int4-litert/resolve/main/gemma3-1b-it-int4.task
          ls -la android/app/src/main/assets/model
          test $(stat -c%s android/app/src/main/assets/model/gemma3-1b-it-int4.task) -gt 400000000
      - name: Native AI plugin
        run: |
          D=android/app/src/main/java/com/bunyan/english
          mkdir -p $D && cp native/LocalLlmPlugin.java native/MainActivity.java $D/
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/' android/variables.gradle
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties
          cat >> android/app/build.gradle <<'GEOF'
          dependencies { implementation 'com.google.mediapipe:tasks-genai:0.10.24' }
          android { androidResources { noCompress += ['task'] } }
          GEOF
          echo "org.gradle.jvmargs=-Xmx4g" >> android/gradle.properties
      - name: Microphone + speech permissions
        run: sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <queries><intent><action android:name="android.speech.RecognitionService" /></intent><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>\n    <application android:largeHeap="true"#' android/app/src/main/AndroidManifest.xml
      - name: Increase versionCode on every build
        run: sed -i "s/versionCode [0-9]*/versionCode $((100 + ${{ github.run_number }}))/; s/versionName \"[^\"]*\"/versionName \"2.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Lock portrait
        run: sed -i 's/<activity /<activity android:screenOrientation="portrait" /' android/app/src/main/AndroidManifest.xml
      - name: Use fixed signing key (so updates install over the old app)
        run: |
          cat >> android/app/build.gradle <<'GEOF'
          android {
            signingConfigs { fixed { storeFile file("${rootDir}/../../keystore/debug.keystore"); storePassword "android"; keyAlias "androiddebugkey"; keyPassword "android" } }
            buildTypes { debug { signingConfig signingConfigs.fixed } }
          }
          GEOF
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Publish APK as a release download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/English-Coach.apk
          ls -la /tmp/English-Coach.apk
          gh release delete english-offline -y --cleanup-tag -R ${{ github.repository }} || true
          gh release create english-offline /tmp/English-Coach.apk -R ${{ github.repository }} --title "مدرّب الإنجليزي (أوفلاين)" --notes "Build ${{ github.run_number }} — on-device AI, works without internet."
