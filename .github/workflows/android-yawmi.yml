name: Build Yawmi APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['yawmi-app/**','.github/workflows/android-yawmi.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yawmi-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#2f6b4f' --iconBackgroundColorDark '#2f6b4f'
      - run: npx cap sync android
      - name: Microphone permission
        run: sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Increase versionCode on every build
        run: sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Lock portrait
        run: sed -i 's/<activity /<activity android:screenOrientation="portrait" /' android/app/src/main/AndroidManifest.xml
      - name: Use fixed signing key (so updates install over the old app)
        run: |
          cat >> android/app/build.gradle <<'GEOF'
          android {
            signingConfigs { fixed { storeFile file("${rootDir}/../../keystore/debug.keystore"); storePassword "android"; keyAlias "androiddebugkey"; keyPassword "android" } }
            buildTypes { debug { signingConfig signingConfigs.fixed } }
          }
          GEOF
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Publish APK to branch apk-yawmi
        run: |
          mkdir /tmp/out && cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/out/Yawmi.apk
          cd /tmp/out && git init -q -b apk-yawmi && git config user.name github-actions && git config user.email actions@github.com
          git add . && git commit -q -m "Build APK" && git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git apk-yawmi
