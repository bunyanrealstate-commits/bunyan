name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['keystore/**','capacitor.config.json','package.json','assets/**','.github/**','www/**']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff'
      - run: npx cap sync android
      - name: Microphone permission
        run: sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Lock portrait
        run: sed -i 's/<activity /<activity android:screenOrientation="portrait" /' android/app/src/main/AndroidManifest.xml
      - name: Use fixed signing key (so updates install over the old app)
        run: |
          cat >> android/app/build.gradle <<'GEOF'
          android {
            signingConfigs { fixed { storeFile file("${rootDir}/../keystore/debug.keystore"); storePassword "android"; keyAlias "androiddebugkey"; keyPassword "android" } }
            buildTypes { debug { signingConfig signingConfigs.fixed } }
          }
          GEOF
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Bunyan-Furnished-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to branch apk
        run: |
          mkdir /tmp/out && cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/out/Bunyan-Furnished.apk
          cd /tmp/out && git init -q -b apk && git config user.name github-actions && git config user.email actions@github.com
          git add . && git commit -q -m "Build APK" && git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git apk
