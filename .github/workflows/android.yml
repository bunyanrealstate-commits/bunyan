name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['keystore/**','capacitor.config.json','package.json','assets/**','.github/**','www/**']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [owner, customer, hakim]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Customer variant config
        if: matrix.variant == 'customer'
        run: |
          node -e "const f='capacitor.config.json',c=JSON.parse(require('fs').readFileSync(f));c.appId='com.bunyan.furnished.client';c.server.url='https://bunyanrealstate-commits.github.io/bunyan/c/';require('fs').writeFileSync(f,JSON.stringify(c,null,1))"
          cat capacitor.config.json
      - name: Abdelhakim variant config
        if: matrix.variant == 'hakim'
        run: |
          node -e "const f='capacitor.config.json',c=JSON.parse(require('fs').readFileSync(f));c.appId='com.bunyan.furnished.hakim';c.appName='بنيان حكيم';c.server.url='https://bunyanrealstate-commits.github.io/bunyan/h/';require('fs').writeFileSync(f,JSON.stringify(c,null,1))"
          cat capacitor.config.json
      - run: npm install
      - run: npx cap add android
      - name: Hakim icon (green with a "حكيم" badge)
        if: matrix.variant == 'hakim'
        run: cp assets/hakim/icon-only.png assets/hakim/icon-foreground.png assets/hakim/icon-background.png assets/
      - run: npx capacitor-assets generate --android --iconBackgroundColor '${{ matrix.variant == 'hakim' && '#2a9d5c' || '#ffffff' }}' --iconBackgroundColorDark '${{ matrix.variant == 'hakim' && '#2a9d5c' || '#ffffff' }}'
      - name: Big readable launcher icon (logo fills the visible circle)
        run: |
          V=main; if [ "${{ matrix.variant }}" = "hakim" ]; then V=hakim; fi
          cp -r assets/launcher/$V/* android/app/src/main/res/
          ls android/app/src/main/res/mipmap-anydpi-v26/ && cat android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
      - run: npx cap sync android
      - name: No launch image (plain white start, the app shows its own splash)
        run: |
          mkdir -p android/app/src/main/res/drawable
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="@android:color/transparent"/><size android:width="1dp" android:height="1dp"/></shape>' > android/app/src/main/res/drawable/bny_blank.xml
          node -e "
          const fs=require('fs');const p='android/app/src/main/res/values/styles.xml';let s=fs.readFileSync(p,'utf8');
          const nw='<style name=\"AppTheme.NoActionBarLaunch\" parent=\"Theme.SplashScreen\"><item name=\"windowSplashScreenBackground\">#FFFFFF</item><item name=\"windowSplashScreenAnimatedIcon\">@drawable/bny_blank</item><item name=\"windowSplashScreenAnimationDuration\">0</item><item name=\"postSplashScreenTheme\">@style/AppTheme.NoActionBar</item><item name=\"android:background\">#FFFFFF</item><item name=\"android:windowBackground\">@android:color/white</item></style>';
          const s2=s.replace(/<style name=\"AppTheme\.NoActionBarLaunch\"[^>]*>[\s\S]*?<\/style>/,nw);
          if(s2===s){console.error('launch theme not found');process.exit(1)}fs.writeFileSync(p,s2);console.log(s2)"
      - name: Notification tone
        run: mkdir -p android/app/src/main/res/raw && cp assets/sounds/bny_tone.wav android/app/src/main/res/raw/bny_tone.wav
      - name: WhatsApp Business first (native helper)
        run: |
          MA=$(find android/app/src/main/java -name MainActivity.java | head -1); D=$(dirname "$MA"); PK=$(grep -m1 '^package' "$MA" | sed 's/package \(.*\);/\1/')
          cat > "$D/WaBizPlugin.java" <<JEOF
          package $PK;
          import android.content.Intent;
          import android.net.Uri;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          @CapacitorPlugin(name = "WaBiz")
          public class WaBizPlugin extends Plugin {
            @PluginMethod
            public void open(PluginCall call) {
              String url = call.getString("url");
              boolean biz = call.getBoolean("business", true);
              String[] order = biz ? new String[]{"com.whatsapp.w4b", "com.whatsapp"} : new String[]{"com.whatsapp", "com.whatsapp.w4b"};
              for (String p : order) {
                try { Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(url)); i.setPackage(p); i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); getContext().startActivity(i); JSObject r = new JSObject(); r.put("app", p); call.resolve(r); return; } catch (Exception e) { }
              }
              try { Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(url)); i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); getContext().startActivity(i); call.resolve(); } catch (Exception e) { call.reject("no whatsapp"); }
            }
            @PluginMethod
            public void shot(final PluginCall call) {
              final android.webkit.WebView wv = getBridge().getWebView();
              final int q = call.getInt("q", 60);
              final double sc = call.getDouble("scale", 0.5);
              wv.post(new Runnable() { public void run() {
                try {
                  int w = wv.getWidth(), h = wv.getHeight();
                  android.graphics.Bitmap bm = android.graphics.Bitmap.createBitmap(w, h, android.graphics.Bitmap.Config.ARGB_8888);
                  android.graphics.Canvas cv = new android.graphics.Canvas(bm);
                  cv.translate(-wv.getScrollX(), -wv.getScrollY());
                  wv.draw(cv);
                  android.graphics.Bitmap sm = android.graphics.Bitmap.createScaledBitmap(bm, Math.max(1, (int)(w * sc)), Math.max(1, (int)(h * sc)), true);
                  java.io.ByteArrayOutputStream os = new java.io.ByteArrayOutputStream();
                  sm.compress(android.graphics.Bitmap.CompressFormat.JPEG, q, os);
                  JSObject r = new JSObject(); r.put("data", android.util.Base64.encodeToString(os.toByteArray(), android.util.Base64.NO_WRAP)); r.put("w", w); r.put("h", h);
                  call.resolve(r);
                } catch (Exception e) { call.reject(String.valueOf(e.getMessage())); }
              } });
            }
            @PluginMethod
            public void accEnabled(PluginCall call) {
              JSObject r = new JSObject();
              try { String v = android.provider.Settings.Secure.getString(getContext().getContentResolver(), android.provider.Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES); r.put("on", v != null && v.contains(getContext().getPackageName() + "/") && v.contains("BnySendService")); } catch (Exception e) { r.put("on", false); }
              call.resolve(r);
            }
            @PluginMethod
            public void shareSheet(PluginCall call) {
              try {
                String data = call.getString("data", ""); String name = call.getString("name", "file.jpg"); String text = call.getString("text", ""); String mime = call.getString("mime", "image/jpeg");
                Intent i = new Intent(Intent.ACTION_SEND); i.setType(mime);
                if (data != null && data.length() > 0) {
                  java.io.File dir = new java.io.File(getContext().getCacheDir(), "share"); dir.mkdirs();
                  java.io.File f = new java.io.File(dir, name.replaceAll("[^A-Za-z0-9._-]", "_"));
                  java.io.FileOutputStream fo = new java.io.FileOutputStream(f); fo.write(android.util.Base64.decode(data, android.util.Base64.DEFAULT)); fo.close();
                  Uri u = androidx.core.content.FileProvider.getUriForFile(getContext(), getContext().getPackageName() + ".fileprovider", f);
                  i.putExtra(Intent.EXTRA_STREAM, u); i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  i.setClipData(android.content.ClipData.newRawUri("", u));
                }
                if (text != null && text.length() > 0) i.putExtra(Intent.EXTRA_TEXT, text);
                Intent ch = Intent.createChooser(i, call.getString("title", "ابعت لـ")); ch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_GRANT_READ_URI_PERMISSION); getContext().startActivity(ch); call.resolve();
              } catch (Exception e) { call.reject(String.valueOf(e.getMessage())); }
            }
            @PluginMethod
            public void copyImage(PluginCall call) {
              try {
                String data = call.getString("data", ""); String name = call.getString("name", "update.jpg");
                java.io.File dir = new java.io.File(getContext().getCacheDir(), "share"); dir.mkdirs();
                java.io.File f = new java.io.File(dir, name.replaceAll("[^A-Za-z0-9._-]", "_"));
                java.io.FileOutputStream fo = new java.io.FileOutputStream(f); fo.write(android.util.Base64.decode(data, android.util.Base64.DEFAULT)); fo.close();
                Uri u = androidx.core.content.FileProvider.getUriForFile(getContext(), getContext().getPackageName() + ".fileprovider", f);
                String[] pk = new String[]{"com.whatsapp", "com.whatsapp.w4b"};
                for (String p : pk) { try { getContext().grantUriPermission(p, u, Intent.FLAG_GRANT_READ_URI_PERMISSION); } catch (Exception e) { } }
                android.content.ClipboardManager cm = (android.content.ClipboardManager) getContext().getSystemService(android.content.Context.CLIPBOARD_SERVICE);
                cm.setPrimaryClip(android.content.ClipData.newUri(getContext().getContentResolver(), "Bunyan update", u));
                call.resolve();
              } catch (Exception e) { call.reject(String.valueOf(e.getMessage())); }
            }
            @PluginMethod
            public void selfUpdate(final PluginCall call) {
              final String url = call.getString("url", "");
              final android.content.Context ctx = getContext();
              final String pkg = ctx.getPackageName();
              try {
                if (android.os.Build.VERSION.SDK_INT >= 26 && !ctx.getPackageManager().canRequestPackageInstalls()) {
                  Intent i = new Intent(android.provider.Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + pkg)); i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); ctx.startActivity(i);
                  JSObject r = new JSObject(); r.put("needPerm", true); call.resolve(r); return;
                }
              } catch (Exception e) { }
              new Thread(new Runnable() { public void run() {
                try {
                  android.content.pm.PackageInstaller pi = ctx.getPackageManager().getPackageInstaller();
                  android.content.pm.PackageInstaller.SessionParams sp = new android.content.pm.PackageInstaller.SessionParams(android.content.pm.PackageInstaller.SessionParams.MODE_FULL_INSTALL);
                  sp.setAppPackageName(pkg);
                  int sid = pi.createSession(sp);
                  android.content.pm.PackageInstaller.Session s = pi.openSession(sid);
                  java.net.HttpURLConnection c = (java.net.HttpURLConnection) new java.net.URL(url).openConnection(); c.setInstanceFollowRedirects(true); c.setConnectTimeout(20000); c.setReadTimeout(60000);
                  java.io.InputStream in = c.getInputStream(); java.io.OutputStream out = s.openWrite("bunyan", 0, -1);
                  byte[] buf = new byte[65536]; int n; long tot = 0; while ((n = in.read(buf)) > 0) { out.write(buf, 0, n); tot += n; }
                  s.fsync(out); out.close(); in.close();
                  if (tot < 100000) throw new Exception("download too small");
                  Intent cb = new Intent(ctx, BnyInstallReceiver.class);
                  int fl = android.app.PendingIntent.FLAG_UPDATE_CURRENT | (android.os.Build.VERSION.SDK_INT >= 31 ? 33554432 : 0);
                  android.app.PendingIntent p = android.app.PendingIntent.getBroadcast(ctx, sid, cb, fl);
                  s.commit(p.getIntentSender()); s.close();
                  JSObject r = new JSObject(); r.put("ok", true); r.put("bytes", tot); call.resolve(r);
                } catch (Exception e) { call.reject(String.valueOf(e.getMessage())); }
              } }).start();
            }
            @PluginMethod
            public void appInfo(PluginCall call) {
              try { Intent i = new Intent(android.provider.Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + getContext().getPackageName())); i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); getContext().startActivity(i); call.resolve(); } catch (Exception e) { call.reject(String.valueOf(e.getMessage())); }
            }
            @PluginMethod
            public void accOpen(PluginCall call) {
              try { Intent i = new Intent(android.provider.Settings.ACTION_ACCESSIBILITY_SETTINGS); i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); getContext().startActivity(i); call.resolve(); } catch (Exception e) { call.reject(String.valueOf(e.getMessage())); }
            }
            @PluginMethod
            public void sendGroup(PluginCall call) {
              try {
                String group = call.getString("group", ""); String data = call.getString("data", ""); String name = call.getString("name", "file.jpg"); String text = call.getString("text", ""); String mime = call.getString("mime", "image/jpeg");
                Intent i = new Intent(Intent.ACTION_SEND); i.setType(mime);
                if (data != null && data.length() > 0) {
                  java.io.File dir = new java.io.File(getContext().getCacheDir(), "share"); dir.mkdirs();
                  java.io.File f = new java.io.File(dir, name.replaceAll("[^A-Za-z0-9._-]", "_"));
                  java.io.FileOutputStream fo = new java.io.FileOutputStream(f); fo.write(android.util.Base64.decode(data, android.util.Base64.DEFAULT)); fo.close();
                  Uri u = androidx.core.content.FileProvider.getUriForFile(getContext(), getContext().getPackageName() + ".fileprovider", f);
                  i.putExtra(Intent.EXTRA_STREAM, u); i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                }
                if (text != null && text.length() > 0) i.putExtra(Intent.EXTRA_TEXT, text);
                i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                String[] order = new String[]{"com.whatsapp.w4b", "com.whatsapp"}; String pk = call.getString("pkg", "");
                if (pk != null && pk.length() > 0) order = new String[]{pk};
                for (String p : order) {
                  try { i.setPackage(p); BnySendService.arm(group, (data != null && data.length() > 0) ? 3 : 2); getContext().startActivity(i); JSObject r = new JSObject(); r.put("app", p); call.resolve(r); return; } catch (Exception e) { }
                }
                call.reject("no whatsapp");
              } catch (Exception e) { call.reject(String.valueOf(e.getMessage())); }
            }
            @PluginMethod
            public void sendFile(PluginCall call) {
              try {
                String data = call.getString("data"); String name = call.getString("name", "file.pdf"); String phone = call.getString("phone", ""); String text = call.getString("text", ""); String mime = call.getString("mime", "application/pdf");
                java.io.File dir = new java.io.File(getContext().getCacheDir(), "share"); dir.mkdirs();
                java.io.File f = new java.io.File(dir, name.replaceAll("[^A-Za-z0-9._-]", "_"));
                java.io.FileOutputStream fo = new java.io.FileOutputStream(f); fo.write(android.util.Base64.decode(data, android.util.Base64.DEFAULT)); fo.close();
                Uri u = androidx.core.content.FileProvider.getUriForFile(getContext(), getContext().getPackageName() + ".fileprovider", f);
                String[] order = new String[]{"com.whatsapp.w4b", "com.whatsapp"};
                for (String p : order) {
                  try {
                    Intent i = new Intent(Intent.ACTION_SEND); i.setType(mime); i.putExtra(Intent.EXTRA_STREAM, u);
                    if (text != null && text.length() > 0) i.putExtra(Intent.EXTRA_TEXT, text);
                    if (phone != null && phone.length() > 0) i.putExtra("jid", phone + "@s.whatsapp.net");
                    i.setPackage(p); i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                    getContext().startActivity(i); JSObject r = new JSObject(); r.put("app", p); call.resolve(r); return;
                  } catch (Exception e) { }
                }
                Intent i = new Intent(Intent.ACTION_SEND); i.setType(mime); i.putExtra(Intent.EXTRA_STREAM, u); i.putExtra(Intent.EXTRA_TEXT, text); i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                Intent ch = Intent.createChooser(i, name); ch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_GRANT_READ_URI_PERMISSION); getContext().startActivity(ch); call.resolve();
              } catch (Exception e) { call.reject(String.valueOf(e.getMessage())); }
            }
            @PluginMethod
            public void resetZoom(PluginCall call) {
              final android.webkit.WebView wv = getBridge().getWebView();
              wv.post(new Runnable() { public void run() { int n = 0; while (n < 40 && wv.zoomOut()) { n++; } } });
              call.resolve();
            }
          }
          JEOF
          sed -i 's/^          //' "$D/WaBizPlugin.java"
          cat > "$D/BnySendService.java" <<JEOF
          package $PK;
          import android.accessibilityservice.AccessibilityService;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import java.util.List;
          /* Only acts for ~40 seconds after the owner taps "send to group" in Bunyan, and only inside WhatsApp:
             picks the group by its exact name in WhatsApp's share list and presses Send. */
          public class BnySendService extends AccessibilityService {
            public static volatile String target = null;
            public static volatile long until = 0;
            public static volatile int stage = 0;
            public static volatile int steps = 3;
            static volatile long lastAct = 0;
            static volatile int scrolls = 0;
            public static void arm(String name, int st) { target = name; steps = st; stage = 0; scrolls = 0; lastAct = 0; until = System.currentTimeMillis() + 40000; }
            @Override public void onInterrupt() { }
            @Override public void onAccessibilityEvent(AccessibilityEvent e) {
              try {
                if (target == null) return;
                long now = System.currentTimeMillis();
                if (now > until) { target = null; return; }
                CharSequence pkg = e.getPackageName();
                if (pkg == null || !pkg.toString().startsWith("com.whatsapp")) return;
                if (now - lastAct < 650) return;
                AccessibilityNodeInfo root = getRootInActiveWindow();
                if (root == null) return;
                if (stage == 0) {
                  List<AccessibilityNodeInfo> L = root.findAccessibilityNodeInfosByText(target);
                  for (AccessibilityNodeInfo n : L) {
                    CharSequence t = n.getText();
                    if (t == null || !t.toString().trim().equalsIgnoreCase(target.trim())) continue;
                    AccessibilityNodeInfo c = n;
                    while (c != null && !c.isClickable()) c = c.getParent();
                    if (c != null && c.performAction(AccessibilityNodeInfo.ACTION_CLICK)) { stage = 1; lastAct = now; return; }
                  }
                  if (scrolls < 10) { AccessibilityNodeInfo sc = scrollable(root); if (sc != null) { sc.performAction(AccessibilityNodeInfo.ACTION_SCROLL_FORWARD); scrolls++; lastAct = now; } }
                  return;
                }
                AccessibilityNodeInfo s = send(root);
                if (s != null && s.performAction(AccessibilityNodeInfo.ACTION_CLICK)) { stage++; lastAct = now; if (stage >= steps) target = null; }
              } catch (Exception ex) { }
            }
            AccessibilityNodeInfo scrollable(AccessibilityNodeInfo n) {
              if (n == null) return null;
              if (n.isScrollable()) return n;
              for (int i = 0; i < n.getChildCount(); i++) { AccessibilityNodeInfo r = scrollable(n.getChild(i)); if (r != null) return r; }
              return null;
            }
            AccessibilityNodeInfo send(AccessibilityNodeInfo root) {
              String[] ids = new String[]{"com.whatsapp.w4b:id/send", "com.whatsapp:id/send", "com.whatsapp.w4b:id/send_media_btn", "com.whatsapp:id/send_media_btn"};
              for (String id : ids) { List<AccessibilityNodeInfo> L = root.findAccessibilityNodeInfosByViewId(id); for (AccessibilityNodeInfo n : L) if (n.isVisibleToUser() && n.isEnabled()) return n; }
              return byDesc(root);
            }
            AccessibilityNodeInfo byDesc(AccessibilityNodeInfo n) {
              if (n == null) return null;
              CharSequence d = n.getContentDescription();
              if (d != null && n.isClickable() && n.isVisibleToUser()) { String x = d.toString().trim(); if (x.equalsIgnoreCase("Send") || x.equals("إرسال") || x.equals("ارسال")) return n; }
              for (int i = 0; i < n.getChildCount(); i++) { AccessibilityNodeInfo r = byDesc(n.getChild(i)); if (r != null) return r; }
              return null;
            }
          }
          JEOF
          sed -i 's/^          //' "$D/BnySendService.java"
          mkdir -p android/app/src/main/res/xml android/app/src/main/res/values
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<accessibility-service xmlns:android="http://schemas.android.com/apk/res/android" android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged" android:packageNames="com.whatsapp,com.whatsapp.w4b" android:accessibilityFeedbackType="feedbackGeneric" android:notificationTimeout="150" android:canRetrieveWindowContent="true" android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows" android:description="@string/bny_acc_desc" />' > android/app/src/main/res/xml/bny_access.xml
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources><string name="bny_acc_desc">بيبعت الأبديت لجروب الواتساب اللي انت اخترته لما تدوس «ابعت للجروب» في بنيان — بيشتغل جوه واتساب بس ولمدة ثواني.</string><string name="bny_acc_label">بنيان — الإرسال للجروب</string></resources>' > android/app/src/main/res/values/bny_strings.xml
          sed -i 's#</application>#    <service android:name=".BnySendService" android:label="@string/bny_acc_label" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="false"><intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter><meta-data android:name="android.accessibilityservice" android:resource="@xml/bny_access" /></service>\n    </application>#' android/app/src/main/AndroidManifest.xml
          grep -n "BnySendService" android/app/src/main/AndroidManifest.xml
          cat > "$D/BnyInstallReceiver.java" <<JEOF
          package $PK;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageInstaller;
          /* shows Android's "update this app?" confirmation for the in-app updater */
          public class BnyInstallReceiver extends BroadcastReceiver {
            @Override public void onReceive(Context c, Intent intent) {
              int st = intent.getIntExtra(PackageInstaller.EXTRA_STATUS, -999);
              if (st == PackageInstaller.STATUS_PENDING_USER_ACTION) {
                Intent confirm = intent.getParcelableExtra(Intent.EXTRA_INTENT);
                if (confirm != null) { confirm.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); try { c.startActivity(confirm); } catch (Exception e) { } }
              }
            }
          }
          JEOF
          sed -i 's/^          //' "$D/BnyInstallReceiver.java"
          sed -i 's#</application>#    <receiver android:name=".BnyInstallReceiver" android:exported="false" />\n    </application>#' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application#' android/app/src/main/AndroidManifest.xml
          cat > "$MA" <<JEOF
          package $PK;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(WaBizPlugin.class);
              super.onCreate(savedInstanceState);
              try { android.webkit.WebSettings ws = getBridge().getWebView().getSettings(); ws.setSupportZoom(true); ws.setBuiltInZoomControls(true); ws.setDisplayZoomControls(false); ws.setUseWideViewPort(true); } catch (Exception e) { }
            }
          }
          JEOF
          sed -i 's/^          //' "$MA"
          cat "$MA" "$D/WaBizPlugin.java"
      - name: Microphone permission
        run: sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Increase versionCode on every build (so each APK installs over the previous one)
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Lock portrait
        run: sed -i 's/<activity /<activity android:screenOrientation="portrait" /' android/app/src/main/AndroidManifest.xml
      - name: Use fixed signing key (so updates install over the old app)
        run: |
          cat >> android/app/build.gradle <<'GEOF'
          android {
            signingConfigs { fixed { storeFile file("${rootDir}/../keystore/debug.keystore"); storePassword "android"; keyAlias "androiddebugkey"; keyPassword "android" } }
            buildTypes { debug { signingConfig signingConfigs.fixed } }
          }
          GEOF
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Bunyan-Furnished-${{ matrix.variant }}-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to branch apk
        run: |
          if [ "${{ matrix.variant }}" = "customer" ]; then NAME=Bunyan-Furnished-Customer.apk; BR=apk-customer; elif [ "${{ matrix.variant }}" = "hakim" ]; then NAME=Bunyan-Hakim.apk; BR=apk-hakim; else NAME=Bunyan-Furnished.apk; BR=apk; fi
          mkdir /tmp/out && cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/out/$NAME
          cd /tmp/out && git init -q -b $BR && git config user.name github-actions && git config user.email actions@github.com
          git add . && git commit -q -m "Build APK" && git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git $BR
