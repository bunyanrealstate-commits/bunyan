name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['keystore/**','capacitor.config.json','package.json','assets/**','.github/**','www/**']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [owner, customer, hakim]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Customer variant config
        if: matrix.variant == 'customer'
        run: |
          node -e "const f='capacitor.config.json',c=JSON.parse(require('fs').readFileSync(f));c.appId='com.bunyan.furnished.client';c.server.url='https://bunyanrealstate-commits.github.io/bunyan/c/';require('fs').writeFileSync(f,JSON.stringify(c,null,1))"
          cat capacitor.config.json
      - name: Abdelhakim variant config
        if: matrix.variant == 'hakim'
        run: |
          node -e "const f='capacitor.config.json',c=JSON.parse(require('fs').readFileSync(f));c.appId='com.bunyan.furnished.hakim';c.appName='بنيان حكيم';c.server.url='https://bunyanrealstate-commits.github.io/bunyan/h/';require('fs').writeFileSync(f,JSON.stringify(c,null,1))"
          cat capacitor.config.json
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff'
      - run: npx cap sync android
      - name: Microphone permission
        run: sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Increase versionCode on every build (so each APK installs over the previous one)
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Lock portrait
        run: sed -i 's/<activity /<activity android:screenOrientation="portrait" /' android/app/src/main/AndroidManifest.xml
      - name: Use fixed signing key (so updates install over the old app)
        run: |
          cat >> android/app/build.gradle <<'GEOF'
          android {
            signingConfigs { fixed { storeFile file("${rootDir}/../keystore/debug.keystore"); storePassword "android"; keyAlias "androiddebugkey"; keyPassword "android" } }
            buildTypes { debug { signingConfig signingConfigs.fixed } }
          }
          GEOF
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Bunyan-Furnished-${{ matrix.variant }}-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to branch apk
        run: |
          if [ "${{ matrix.variant }}" = "customer" ]; then NAME=Bunyan-Furnished-Customer.apk; BR=apk-customer; elif [ "${{ matrix.variant }}" = "hakim" ]; then NAME=Bunyan-Hakim.apk; BR=apk-hakim; else NAME=Bunyan-Furnished.apk; BR=apk; fi
          mkdir /tmp/out && cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/out/$NAME
          cd /tmp/out && git init -q -b $BR && git config user.name github-actions && git config user.email actions@github.com
          git add . && git commit -q -m "Build APK" && git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git $BR
