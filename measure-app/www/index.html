<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2b705">
<title>مساحة الغرف</title>
<style>
/* Layout: one column, the area number is the hero; tape-yellow accent */
:root{
  --bg:#eef0ee; --card:#ffffff; --fg:#1d2420; --muted:#5f6a64; --line:#d5dad6;
  --accent:#f2b705; --accentInk:#2a2100; --soft:#fff6d6;
  --font:"Segoe UI",Tahoma,system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141816; --card:#1d2220; --fg:#e8ece9; --muted:#9aa59f; --line:#2e3532;
  --accent:#f5c22a; --accentInk:#221a00; --soft:#2c2710; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.4rem;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:4px;border-radius:12px}
.tab{font:inherit;border:0;border-radius:9px;padding:10px;background:transparent;color:var(--muted);cursor:pointer;font-weight:600}
.tab.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
label{font-size:.88rem;color:var(--muted)}
.f{display:flex;flex-direction:column;gap:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
input[type=number]{font-size:1.3rem;text-align:center;font-variant-numeric:tabular-nums}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hero{background:var(--soft);border-radius:14px;padding:18px;text-align:center}
.hero b{display:block;font-size:2.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.hero span{color:var(--muted);font-size:.9rem}
.note{font-size:.85rem;color:var(--muted);margin:0}
.btn{font:inherit;font-weight:700;border:0;border-radius:11px;padding:13px;cursor:pointer;background:var(--accent);color:var(--accentInk)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:500}
.row{display:flex;gap:10px}.row .btn{flex:1}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:11px}
.item .n{flex:1;min-width:0}.item b{display:block}
.item small{color:var(--muted)}
.item .a{font-weight:700;font-variant-numeric:tabular-nums}
.x{background:none;border:0;color:var(--muted);font-size:1.3rem;padding:4px 8px}
.total{display:flex;justify-content:space-between;font-weight:700;padding-top:6px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:.9rem}
</style></head><body>
<div class="wrap">
  <h1>مساحة الغرف</h1>

  <section class="card">
    <div class="tabs" role="tablist">
      <button class="tab on" id="tTiles" type="button">بعدّ البلاط</button>
      <button class="tab" id="tMeters" type="button">بالمتر</button>
    </div>

    <div id="pTiles" class="f" style="gap:12px">
      <div class="f">
        <label for="tile">مقاس البلاطة</label>
        <select id="tile">
          <option value="0.60">60 × 60 سم</option>
          <option value="0.80">80 × 80 سم</option>
          <option value="1.20">120 × 60 سم (العدّ على الطول 120)</option>
          <option value="0.45">45 × 45 سم</option>
          <option value="0.40">40 × 40 سم</option>
          <option value="0.30">30 × 30 سم</option>
          <option value="custom">مقاس آخر…</option>
        </select>
      </div>
      <div class="f" id="customBox" hidden>
        <label for="tileC">مقاس البلاطة بالسنتيمتر (قِسه بالمتر الصغير)</label>
        <input type="number" id="tileC" inputmode="decimal" placeholder="60">
      </div>
      <div class="two">
        <div class="f"><label for="nL">عدد البلاط على الطول</label><input type="number" id="nL" inputmode="decimal" step="0.25" placeholder="7"></div>
        <div class="f"><label for="nW">عدد البلاط على العرض</label><input type="number" id="nW" inputmode="decimal" step="0.25" placeholder="5.5"></div>
      </div>
      <p class="note">عدّ البلاط من جدار لجدار على حافة الغرفة. البلاطة المقصوصة احسبها بالتقريب: نص = 0.5، ربع = 0.25.</p>
    </div>

    <div id="pMeters" class="two" hidden>
      <div class="f"><label for="mL">الطول (متر)</label><input type="number" id="mL" inputmode="decimal" step="0.01" placeholder="4.20"></div>
      <div class="f"><label for="mW">العرض (متر)</label><input type="number" id="mW" inputmode="decimal" step="0.01" placeholder="3.50"></div>
    </div>

    <div class="hero" aria-live="polite">
      <b id="area">—</b>
      <span id="dims">مساحة الأرضية بالمتر المربع</span>
    </div>

    <div class="f"><label for="name">اسم الغرفة</label><input type="text" id="name" placeholder="مثال: غرفة 3"></div>
    <div class="row">
      <button class="btn" id="save" type="button">حفظ</button>
      <button class="btn ghost" id="clear" type="button">مسح</button>
    </div>
  </section>

  <section class="card">
    <div class="row" style="align-items:center;justify-content:space-between">
      <strong>الغرف المحفوظة</strong>
      <button class="btn ghost" id="copy" type="button" style="flex:none;padding:8px 14px">نسخ</button>
    </div>
    <div class="list" id="list"></div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>
<script>
const $=id=>document.getElementById(id);
const KEY='room-area-v1';
let mode='tiles',rooms=[];
try{rooms=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
const f2=n=>Number(n).toFixed(2);
const num=id=>{const v=parseFloat($(id).value);return v>0?v:0};
function tileSize(){return $('tile').value==='custom'?num('tileC')/100:parseFloat($('tile').value)}
function current(){
  let L,W;
  if(mode==='tiles'){const t=tileSize();const tw=$('tile').value==='1.20'?0.60:t;L=num('nL')*t;W=num('nW')*tw}
  else{L=num('mL');W=num('mW')}
  return{L,W,A:L*W};
}
function update(){
  const c=current();
  if(c.L&&c.W){$('area').textContent=f2(c.A)+' م²';$('dims').textContent=f2(c.L)+' م × '+f2(c.W)+' م'}
  else{$('area').textContent='—';$('dims').textContent='مساحة الأرضية بالمتر المربع'}
}
function setMode(m){mode=m;$('tTiles').classList.toggle('on',m==='tiles');$('tMeters').classList.toggle('on',m==='meters');$('pTiles').hidden=m!=='tiles';$('pMeters').hidden=m!=='meters';update()}
$('tTiles').onclick=()=>setMode('tiles');$('tMeters').onclick=()=>setMode('meters');
$('tile').onchange=()=>{$('customBox').hidden=$('tile').value!=='custom';update()};
['tileC','nL','nW','mL','mW'].forEach(i=>$(i).addEventListener('input',update));
function persist(){try{localStorage.setItem(KEY,JSON.stringify(rooms))}catch(e){}}
function render(){
  const el=$('list');el.innerHTML='';
  if(!rooms.length){el.innerHTML='<p class="note">لا توجد غرف محفوظة. احسب المساحة واضغط «حفظ».</p>';return}
  let tot=0;
  rooms.forEach((r,i)=>{tot+=r.A;
    const d=document.createElement('div');d.className='item';
    d.innerHTML=`<div class="n"><b></b><small>${f2(r.L)} × ${f2(r.W)} م</small></div><span class="a">${f2(r.A)} م²</span><button class="x" aria-label="حذف">×</button>`;
    d.querySelector('b').textContent=r.name;
    d.querySelector('.x').onclick=()=>{rooms.splice(i,1);persist();render()};
    el.appendChild(d)});
  if(rooms.length>1){const t=document.createElement('div');t.className='total';t.innerHTML=`<span>الإجمالي</span><span>${f2(tot)} م²</span>`;el.appendChild(t)}
}
function toast(t){const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,1800)}
$('save').onclick=()=>{const c=current();if(!c.L||!c.W){toast('أدخل الطول والعرض أولاً');return}
  rooms.unshift({name:$('name').value.trim()||('غرفة '+(rooms.length+1)),L:c.L,W:c.W,A:c.A});persist();render();toast('تم الحفظ')};
$('clear').onclick=()=>{['nL','nW','mL','mW','name'].forEach(i=>$(i).value='');update()};
$('copy').onclick=()=>{
  if(!rooms.length){toast('لا توجد غرف');return}
  const txt=rooms.map(r=>`${r.name}: ${f2(r.A)} م² (${f2(r.L)}×${f2(r.W)})`).join('\n');
  const fb=()=>{const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('تم النسخ')}catch(e){}t.remove()};
  try{navigator.clipboard.writeText(txt).then(()=>toast('تم النسخ'),fb)}catch(e){fb()}};
render();update();
</script>
</body></html>
