<style>
:root{--bg:#e8e9ed;--card:#fff;--tx:#1d1e22;--mu:#62646d;--bd:#d6d7dd;--ac:#1473e6;--chrome:#222326;--chrome2:#2c2d31;--chrome-tx:#ececf0;--chrome-mu:#a3a4ad;--ok:#1a8f50;--bad:#d93d42;--hd:linear-gradient(135deg,#232326,#2c2c30);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141417;--card:#1f2024;--tx:#ececf0;--mu:#9c9da6;--bd:#34353b;--ac:#4b9bff;--ok:#46c77f;--bad:#f2747a;--hd:linear-gradient(135deg,#232326,#2c2c30)}}
:root[data-theme="dark"]{--bg:#141417;--card:#1f2024;--tx:#ececf0;--mu:#9c9da6;--bd:#34353b;--ac:#4b9bff;--ok:#46c77f;--bad:#f2747a;--hd:linear-gradient(135deg,#232326,#2c2c30)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.5}
main{max-width:900px;margin:0 auto;padding:14px}
h1{font-size:19px;margin:0}.hd{background:var(--hd);color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.hd button{background:rgba(255,255,255,.18);color:#fff;border-color:transparent;padding:4px 10px}.nav button{border-radius:99px}th{background:var(--bg)}body{font-size:16px;font-weight:600}main h2{font-size:18px;font-weight:800}main label,.dlg label,main .mu,main .stat span{font-size:13px;font-weight:700}main .stat b{font-size:23px;font-weight:800}th{font-size:14px;font-weight:800}.ntb{background:rgba(245,158,11,.2);color:var(--tx);border:1px solid #f59e0b;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-weight:700;cursor:pointer}select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}.ov.lg{background:var(--hd);z-index:30}#toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#fff;padding:12px;border-radius:12px;display:none;z-index:40}h2{font-size:16px;margin:0 0 10px}
.nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.nav button{white-space:nowrap}.nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(20,33,61,.07)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;border-inline-start:4px solid var(--ac);box-shadow:0 2px 8px rgba(20,33,61,.07)}
.stat b{display:block;font-size:20px}.stat span,.mu{font-size:12px;color:var(--mu)}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 2px}
input{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;min-width:0}
button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.x{color:var(--bad);padding:4px 8px}
.li{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px}
.li>span{flex:1}.chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.chip{font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--bd);cursor:pointer}
.chip.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
.v{padding:12px;border-radius:10px;font-weight:600;margin:10px 0}
.v1{background:rgba(15,110,86,.15);color:var(--ok)}.v0{background:rgba(179,38,30,.15);color:var(--bad)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dlg{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:420px;max-height:90%;overflow:auto}
.bt{display:flex;gap:8px;margin-top:14px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
main{max-width:none!important;padding:12px 24px!important}.nav{flex-wrap:wrap;overflow:visible}.grid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))!important}#app{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(520px,100%),1fr));gap:12px;align-items:start}#app>*{margin:0!important}#app>.grid,#app>.v,#app>button,#app>.card:has(table){grid-column:1/-1}#app>button{justify-self:start}.card{padding:12px}
.dt{font-weight:800;font-size:17px}.bd{display:inline-block;padding:3px 12px;border-radius:99px;font-weight:800;color:#fff;white-space:nowrap}.b0{background:#dc2626}.b1{background:#ea580c}.b2{background:#ca8a04}.b3{background:#15803d}tr.r0 td{background:rgba(220,38,38,.12)}tr.r1 td{background:rgba(234,88,12,.12)}tr.r2 td{background:rgba(202,138,4,.12)}td:last-child{white-space:normal}
.hd select{width:auto!important;min-width:190px;background:rgba(255,255,255,.18);color:#fff;border:0;padding:6px 10px;font-weight:800}.hd select option{color:#10302c}

/* ===== مظهر جديد ===== */
body{font-family:'IBM Plex Sans Arabic',Tahoma,system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:600;letter-spacing:0;font-variant-numeric:tabular-nums}
button,input,select{font-family:inherit}
.hd{border-radius:14px;padding:12px 18px;border-bottom:3px solid #1473e6;box-shadow:0 6px 20px rgba(15,39,66,.18)}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;letter-spacing:.2px}
.nav{gap:6px;padding:4px 0 6px}
.nav button{border:1px solid var(--bd);background:var(--card);color:var(--mu);font-weight:700;font-size:14px;padding:7px 14px;border-radius:99px;transition:background .15s,color .15s,border-color .15s}
.nav button:hover{color:var(--tx);border-color:var(--ac)}
.nav button.on{background:var(--ac);border-color:var(--ac);color:#fff;box-shadow:0 3px 10px rgba(30,79,143,.28)}
.card{border-radius:14px;padding:16px 18px;box-shadow:0 1px 2px rgba(15,39,66,.06),0 8px 24px rgba(15,39,66,.06)}
main h2{font-size:17px;font-weight:700;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--bd)}
.stat{border-radius:14px;border:1px solid var(--bd);border-inline-start:1px solid var(--bd);padding:14px 16px;display:flex;flex-direction:column;gap:2px;box-shadow:0 1px 2px rgba(15,39,66,.06),0 8px 24px rgba(15,39,66,.06)}
main .stat>span:first-child{font-size:13px;font-weight:700;color:var(--mu)}
main .stat b{font-size:26px;font-weight:700;line-height:1.25;letter-spacing:-.2px}
table{border-collapse:separate;border-spacing:0}
th{background:var(--bg);color:var(--mu);font-size:13px;font-weight:700;position:sticky;top:0}
th:first-child{border-top-right-radius:8px}th:last-child{border-top-left-radius:8px}
td,th{padding:9px 10px}
tbody tr:hover td{background:rgba(30,79,143,.06)}
tr.r0 td{background:rgba(220,38,38,.10)}tr.r1 td{background:rgba(234,88,12,.10)}tr.r2 td{background:rgba(202,138,4,.10)}
button{border-radius:10px;transition:background .15s,border-color .15s,transform .05s}
button:hover{border-color:var(--ac)}button:active{transform:translateY(1px)}
button.p{box-shadow:0 3px 10px rgba(30,79,143,.25);font-weight:700}
input,select{border-radius:10px;padding:10px 12px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,button:focus-visible{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(30,79,143,.22)}
.li{padding:10px 0}
.chip{padding:4px 10px;font-weight:700}
.dlg{border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:20px}
.ov{backdrop-filter:blur(3px)}
.ntb{border-radius:12px}
.v{border-radius:12px}
@media (max-width:640px){main{padding:10px 14px!important}.brand{font-size:17px}.hd{padding:10px 14px}main .stat b{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.navrest{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1px dashed var(--bd);border-radius:14px;background:var(--card)}

/* ===== واجهة احترافية: شريط علوي + قائمة جانبية ===== */
main{display:grid!important;grid-template-columns:232px minmax(0,1fr);grid-auto-rows:auto;padding:0!important;max-width:none!important;min-height:100vh;align-content:start}
.hd{grid-column:1/-1;grid-row:1;border-radius:0!important;margin:0!important;background:var(--chrome)!important;border-bottom:1px solid #000!important;box-shadow:none!important;padding:8px 18px!important;min-height:52px;position:sticky;top:0;z-index:15}
.hd select{background:var(--chrome2)!important;border:1px solid #3a3b41!important;border-radius:8px!important;color:var(--chrome-tx)!important;padding:6px 10px!important;font-weight:600}
.hd button{background:var(--chrome2)!important;border:1px solid #3a3b41!important;color:var(--chrome-tx)!important;border-radius:8px!important}
.hd button:hover{background:#38393f!important}
#who{color:var(--chrome-mu);font-size:13px}
.brand{font-size:17px;font-weight:700}
#nav{grid-column:1;grid-row:2/span 6;background:var(--chrome);margin:0;padding:12px 10px 20px;display:flex!important;flex-direction:column;flex-wrap:nowrap!important;overflow:visible!important;gap:2px;position:sticky;top:52px;height:calc(100vh - 52px);align-self:start;overflow-y:auto!important}
#nav>button{display:flex;align-items:center;gap:12px;width:100%;text-align:right;border:0!important;background:transparent!important;color:var(--chrome-mu)!important;border-radius:8px!important;padding:10px 12px!important;font-size:14px!important;font-weight:600!important;box-shadow:none!important;white-space:nowrap}
#nav>button:hover{background:var(--chrome2)!important;color:var(--chrome-tx)!important}
#nav>button.on{background:#393a41!important;color:#fff!important}
#nav>button.on svg{color:#6aa8ff}
#nav svg{flex:none;width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav .bdg{margin-inline-start:auto;background:#e5484d;color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
#nav .chev{margin-inline-start:auto;width:14px;height:14px}
.navrest{display:flex;flex-direction:column;gap:2px;padding:2px 0 6px!important;border:0!important;background:transparent!important;margin-inline-start:14px;border-inline-start:1px solid #3a3b41!important;border-radius:0!important}
.navrest button{display:flex;align-items:center;gap:10px;width:100%;text-align:right;border:0!important;background:transparent!important;color:var(--chrome-mu)!important;border-radius:8px!important;padding:8px 10px!important;font-size:13px!important;box-shadow:none!important}
.navrest button:hover{background:var(--chrome2)!important;color:var(--chrome-tx)!important}
.navrest button.on{background:#393a41!important;color:#fff!important}
#ntb,#app,main>p{grid-column:2;margin-inline:22px!important}
#ntb{margin-top:16px!important}
#app{padding-top:16px;padding-bottom:24px}
main>p.mu{padding-bottom:20px}
.card{border-radius:10px!important;box-shadow:none!important;border:1px solid var(--bd)!important;padding:16px 18px!important}
.stat{border-radius:10px!important;box-shadow:none!important}
main h2{font-size:15px!important;border-bottom:1px solid var(--bd)}
th{background:transparent!important;border-bottom:1px solid var(--bd)}
button{border-radius:99px}
button.p{box-shadow:none!important;border-radius:99px}
button.x{border-radius:8px}
input,select{border-radius:6px!important;border:1px solid #b9bac2;background:var(--card)}
input:focus,select:focus,button:focus-visible{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ac)!important;border-color:var(--ac)!important}
.dlg{border-radius:12px!important}
.nav{margin:0}
@media (max-width:860px){
 main{grid-template-columns:minmax(0,1fr)}
 #nav{grid-column:1;grid-row:2;flex-direction:row;height:auto;position:sticky;top:52px;z-index:14;overflow-x:auto!important;overflow-y:hidden!important;padding:6px 8px;gap:4px;flex-wrap:nowrap!important;align-items:center}
 #nav>button{width:auto;flex:none;padding:8px 12px!important}
 .navrest{flex-direction:row;flex:none;flex-wrap:nowrap;align-items:center;margin:0;border:0!important;padding:0!important;gap:2px;border-inline-start:1px solid #3a3b41!important;padding-inline-start:6px!important}
 .hd{gap:6px}#who button{padding:4px 8px!important;font-size:12px}.hd select{min-width:0!important;max-width:150px}
 .navrest button{width:auto;flex:none;padding:8px 10px!important}
 #ntb,#app,main>p{grid-column:1;grid-row:auto;margin-inline:14px!important}
 .hd{padding:6px 12px!important}
}

/* ===== توحيد الأخضر مع باقي الألوان ===== */
.v1{background:color-mix(in srgb,var(--ok) 13%,var(--card))!important;color:var(--ok)!important;border:1px solid color-mix(in srgb,var(--ok) 35%,var(--card))}
.v0{background:color-mix(in srgb,var(--bad) 12%,var(--card))!important;color:var(--bad)!important;border:1px solid color-mix(in srgb,var(--bad) 35%,var(--card))}
.chip.on{background:var(--ok)!important;border-color:var(--ok)!important}
.b3{background:var(--ok)!important}.b0{background:var(--bad)!important}
tbody tr:hover td{background:color-mix(in srgb,var(--ac) 7%,var(--card))!important}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.tg{display:inline-block;font-size:11px;padding:1px 9px;border-radius:99px;margin-inline-end:6px;font-weight:700;background:color-mix(in srgb,var(--mu) 16%,var(--card));color:var(--mu)}
.tg-rent,.tg-recv{background:color-mix(in srgb,var(--ok) 16%,var(--card));color:var(--ok)}
.tg-inst,.tg-debt,.tg-exp{background:color-mix(in srgb,var(--bad) 14%,var(--card));color:var(--bad)}
summary{list-style:none}summary::-webkit-details-marker{display:none}

/*contrast*/
:root{--mu:#454852;--tx:#0e0f12;--bd:#c3c5cd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--mu:#c4c6cf;--tx:#f7f7fa;--bd:#44454d}}
:root[data-theme="dark"]{--mu:#c4c6cf;--tx:#f7f7fa;--bd:#44454d}
body{font-size:17px;font-weight:700;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.mu{font-size:14px;font-weight:600;color:var(--mu)}
th{font-size:14px!important;font-weight:700!important;color:var(--mu)!important}
td{font-size:15.5px;font-weight:700}
.nav button{color:#f1f2f7!important;font-size:15.5px!important;font-weight:700!important;opacity:1!important}.nav button.on{color:#fff!important}.nav button svg{opacity:1!important;stroke:currentColor}.nav button span{color:inherit!important}.hd button,.hd select{font-weight:700}
small,.s,.sm{font-size:13.5px}
:root{--chrome-mu:#e3e5ec}#nav>button,.navrest button{color:#eceef4!important;font-size:15.5px!important;font-weight:700!important}#nav>button.on,.navrest button.on{color:#fff!important}#who{font-size:14px}

#bell{position:relative;background:transparent;border:1px solid var(--chrome-bd,#3a3b41);color:#fff;border-radius:10px;padding:5px 10px;font-weight:800;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
#bell b{min-width:20px;height:20px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;padding:0 6px;background:#5a5c66;color:#fff}
#bell.al{background:#f59e0b;border-color:#f59e0b;color:#1a1200}#bell.al b{background:#1a1200;color:#ffd27a}
#bell.od{background:#e5383b;border-color:#e5383b;color:#fff;animation:bellp 1.6s 4}#bell.od b{background:#fff;color:#c1121f}
@keyframes bellp{0%,100%{box-shadow:0 0 0 0 rgba(229,56,59,.6)}50%{box-shadow:0 0 0 7px rgba(229,56,59,0)}}
.ntb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#f59e0b!important;border:0!important;color:#1a1200!important;font-size:15.5px;font-weight:800;border-radius:12px;padding:12px 14px!important;box-shadow:0 4px 14px rgba(245,158,11,.35)}
.ntb.od{background:#e5383b!important;color:#fff!important;box-shadow:0 4px 14px rgba(229,56,59,.4)}
.ntb .cnt{background:rgba(0,0,0,.22);border-radius:99px;padding:2px 10px;white-space:nowrap}
.ntb .tx{flex:1;min-width:180px}

#vbtn{background:transparent;border:1px solid var(--chrome-bd,#3a3b41);color:#fff;border-radius:10px;padding:5px 11px;font-size:17px;cursor:pointer}
.vcb{background:var(--card);color:var(--tx);border-radius:16px;width:min(520px,100%);padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:12px}
.vch{display:flex;justify-content:space-between;align-items:center;font-size:18px}.vcx{border:0;background:transparent;color:var(--tx);font-size:18px;cursor:pointer}
.vcin{display:flex;gap:8px}.vcin input{flex:1;font-size:17px;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-family:inherit;font-weight:700}
.vcmic{border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:20px;padding:0 16px;cursor:pointer}.vcmic.rec{background:#e5383b;animation:bellp 1.2s infinite}
.vcr:empty{display:none}.vcq,.vco,.vce{padding:12px;border-radius:12px;font-weight:700;line-height:1.7}
.vcq{background:rgba(245,158,11,.18);border:1px solid #f59e0b}.vco{background:rgba(22,163,74,.15);border:1px solid #16a34a}.vce{background:rgba(229,56,59,.14);border:1px solid #e5383b}
.vcb2{display:flex;gap:8px;margin-top:6px}.vcb2 button{flex:1}.vcex{font-size:13.5px;color:var(--mu);line-height:1.8}

.hd>span{display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
.hd #ws{order:1}#vbtn{order:2}#bell{order:3}.hd button[onclick^="toggleMode"]{order:4}.hd #who{order:5;margin-inline-start:6px;padding-inline-start:14px;border-inline-start:1px solid #3a3b41}
#vbtn,#bell,.hd button[onclick^="toggleMode"]{width:40px;height:40px;padding:0!important;display:inline-flex!important;align-items:center;justify-content:center;font-size:18px!important;border-radius:10px!important;position:relative;gap:0}
#bell b{position:absolute;top:-6px;inset-inline-start:-6px;min-width:19px;height:19px;font-size:11.5px;padding:0 5px;border:2px solid var(--chrome,#232326)}
#bell.od{background:#e5383b!important}#bell.al{background:#f59e0b!important;color:#1a1200!important}
.um{position:relative}
.umb{display:flex!important;align-items:center;gap:8px;height:40px;padding:0 10px 0 6px!important;font-size:14.5px!important;border-radius:10px!important}
.av{width:28px;height:28px;border-radius:50%;background:var(--ac);color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.umb svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.ump{display:none;position:absolute;top:calc(100% + 10px);inset-inline-end:0;min-width:210px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.35);padding:6px;z-index:40;flex-direction:column;gap:2px}
.um.open .ump{display:flex}
.ump .who2{padding:8px 12px;color:var(--mu);font-size:13px;border-bottom:1px solid var(--bd);margin-bottom:4px}
.ump button{background:transparent!important;color:var(--tx)!important;border:0!important;text-align:right;padding:10px 12px!important;border-radius:8px!important;width:100%;height:auto!important;font-size:15px!important;display:block!important}
.ump button:hover{background:var(--bg)!important}.ump button.dg{color:#e5383b!important}
@media(max-width:700px){.umb .nm2{display:none}.hd #who{margin-inline-start:0;padding-inline-start:8px}.hd>span{gap:6px;flex-wrap:wrap;justify-content:flex-end}#vbtn,#bell,.hd button[onclick^="toggleMode"]{width:36px;height:36px}}

.hd #ws{font-size:18px!important;font-weight:800!important;height:44px;min-width:290px!important;max-width:380px;padding:0 14px!important;border-radius:12px!important}
.hd #ws option{font-size:17px;font-weight:700}
@media(max-width:700px){.hd #ws{font-size:16px!important;height:40px;min-width:0!important;max-width:210px!important;width:auto}}
p.mu[style*="grid-column:1/-1"]{font-size:18px;font-weight:800;color:var(--tx);padding-bottom:6px}

:root{--chrome:#1b1e26;--chrome2:#272b35}
#bell.al{background:#1473e6!important;border-color:#1473e6!important;color:#fff!important}#bell.al b{background:#fff;color:#0b4db0}
.ntb{background:#1473e6!important;color:#fff!important;box-shadow:0 4px 14px rgba(20,115,230,.35)!important}
.ntb.od{background:#e5383b!important}
.vcq{background:rgba(20,115,230,.12)!important;border-color:#1473e6!important}

/*chrome-light*/
:root{--cfg:#14161b;--cbd:#d3d7df;--con:#e3eeff;--conc:#0b4db0;--chrome:#ffffff;--chrome2:#f1f3f7;--chrome-tx:#14161b;--chrome-mu:#2f3541}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cfg:#f1f2f7;--cbd:#3a3b41;--con:#393a41;--conc:#fff;--chrome:#1b1e26;--chrome2:#272b35;--chrome-tx:#ececf0;--chrome-mu:#e3e5ec}}
:root[data-theme="dark"]{--cfg:#f1f2f7;--cbd:#3a3b41;--con:#393a41;--conc:#fff;--chrome:#1b1e26;--chrome2:#272b35;--chrome-tx:#ececf0;--chrome-mu:#e3e5ec}
.hd{color:var(--cfg)!important;background:var(--chrome)!important;border-bottom:1px solid var(--cbd)!important}
.hd h1,.hd .brand,.hd .brand span{color:var(--cfg)!important}

#bell b{border-color:var(--chrome)!important}

#nav>button,.navrest button{color:var(--cfg)!important}

.card{padding:22px 24px!important;margin-bottom:26px!important;border-radius:16px!important}
.card h2,main .card>h2{font-size:18px;margin:0 0 18px!important;padding:0 12px 14px 0!important;border-bottom:2px solid var(--bd);border-inline-start:0;position:relative}

.grid{gap:16px!important;margin-bottom:26px!important}

.li{padding:14px 4px!important;gap:12px!important}
.li:last-child{border-bottom:0}
th,td{padding:13px 12px!important}
table tr:nth-child(even) td{background:rgba(127,135,150,.06)}
.chips{gap:8px!important;margin:12px 0!important}.chip{padding:5px 12px!important;font-size:13px!important}

label{margin:14px 0 6px!important}

#lgm{order:4}.hd button[onclick^="toggleMode"]{order:5}.hd #who{order:6}

html[lang="ur"] body{font-family:'IBM Plex Sans Arabic','Noto Nastaliq Urdu','Noto Naskh Arabic',Tahoma,system-ui,sans-serif}

/* ===== إطارات واضحة ===== */
:root{--fr:#8d97a8;--frs:#c3cad6;--hd2:#eef1f6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fr:#6b7588;--frs:#454d5e;--hd2:#2a3040}}
:root[data-theme="dark"]{--fr:#6b7588;--frs:#454d5e;--hd2:#2a3040}
.card{border:2px solid var(--fr)!important;border-radius:14px!important}
.stat{border:2px solid var(--fr)!important;border-radius:12px!important}
.card h2{padding-bottom:12px;margin-bottom:16px!important;border-bottom:2px solid var(--frs)}
.sc{border:1.5px solid var(--fr);border-radius:10px;overflow-x:auto;background:var(--card)}
.sc table{border-collapse:collapse!important;width:100%}
.sc th,.sc td{border:1px solid var(--frs)!important;border-bottom:1px solid var(--frs)!important}
.sc th{background:var(--hd2)!important;color:var(--tx)!important;border-bottom:2px solid var(--fr)!important}
.sc tr:last-child td{border-bottom:1px solid var(--frs)!important}
.sc tr:nth-child(even) td{background-image:linear-gradient(rgba(120,130,150,.06),rgba(120,130,150,.06))}
table:not(.sc table){border-collapse:collapse!important}
input,select,textarea{border:1.5px solid var(--fr)!important;border-radius:8px!important}
input:focus,select:focus,textarea:focus{border-color:var(--ac)!important}
label{display:block}
.card .card,.card .box,.card>div:not(.sc):not(.grid):not(.dlg){border-radius:10px}
.dlg{border:2px solid var(--fr)!important}

/* ===== إطار للتبويبات ===== */
#nav>button,.navrest button{border:1.5px solid var(--fr)!important;border-radius:10px!important;margin:0 0 8px!important;background:var(--card)!important}
#nav>button.on,.navrest button.on{border-color:var(--ac)!important;border-width:2px!important;background:rgba(26,115,232,.10)!important}
