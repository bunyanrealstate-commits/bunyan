name: offers
description: عروض الشقق — الفلل والشقق المتاحة والفيديوهات وإرسالها للعميل
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  intl: ^0.19.0
  photo_manager: ^3.5.0
  image_picker: ^1.1.2
  share_plus: ^10.1.4
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  fonts:
    - family: Plex
      fonts:
        - asset: fonts/PlexArabic-500.ttf
        - asset: fonts/PlexArabic-700.ttf
          weight: 700
