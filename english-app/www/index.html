<title>مدرّب الإنجليزي</title>

<style>
/* Layout: one-column phone app, sticky top bar + bottom tab bar; English text set in a book serif, UI in Plex Arabic. */
:root{
  --bg:#EEF2F7; --surface:#FFFFFF; --sunk:#E3E9F2; --fg:#16203A; --muted:#5A6684; --line:#D3DBE8;
  --accent:#2747C9; --accent-ink:#FFFFFF; --accent-soft:#DFE6FB;
  --good:#1C8A5E; --good-soft:#D8F1E6; --bad:#C63B3B; --bad-soft:#F8DEDE; --warn:#B07612; --warn-soft:#F7EBD2;
  --ui:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --en:"Newsreader",Georgia,"Times New Roman",serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1424; --surface:#172038; --sunk:#111A2E; --fg:#E7ECF7; --muted:#9AA6C2; --line:#28334F;
  --accent:#7D98FF; --accent-ink:#0E1424; --accent-soft:#222F57;
  --good:#4CC892; --good-soft:#163A2D; --bad:#F07A7A; --bad-soft:#41202A; --warn:#E5B04F; --warn-soft:#3A2E16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1424; --surface:#172038; --sunk:#111A2E; --fg:#E7ECF7; --muted:#9AA6C2; --line:#28334F;
  --accent:#7D98FF; --accent-ink:#0E1424; --accent-soft:#222F57;
  --good:#4CC892; --good-soft:#163A2D; --bad:#F07A7A; --bad-soft:#41202A; --warn:#E5B04F; --warn-soft:#3A2E16; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.6;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{font-weight:700;font-size:18px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.lvchip{font-family:var(--en);font-weight:600;font-size:15px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:4px 14px;direction:ltr}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
h2{font-size:20px} h3{font-size:16px}
p{margin:0}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.label{font-size:12px;letter-spacing:.04em;color:var(--muted);font-weight:500}
.en{font-family:var(--en);direction:ltr;text-align:left;unicode-bidi:isolate}
.big-en{font-family:var(--en);font-size:22px;line-height:1.45;direction:ltr;text-align:left}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.opt:focus-visible,.tab:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn svg{width:18px;height:18px;flex:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;direction:ltr;font-family:var(--en);font-size:17px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;min-height:48px}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.prog{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
/* CEFR scale */
.cefr{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;direction:ltr}
.cefr span{font-family:var(--en);font-weight:600;text-align:center;padding:8px 0;border-radius:8px;background:var(--sunk);color:var(--muted);font-size:14px}
.cefr span.on{background:var(--accent-soft);color:var(--accent)}
.cefr span.cur{background:var(--accent);color:var(--accent-ink)}
.skills{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;font-variant-numeric:tabular-nums}
.skills .bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.skills .bar i{display:block;height:100%;border-radius:99px}
.plan{display:flex;flex-direction:column;gap:0;counter-reset:s}
.plan button{all:unset;cursor:pointer;display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.plan button:first-child{border-top:0}
.plan button:focus-visible{outline:3px solid var(--accent)}
.plan .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-weight:700;font-size:13px}
.plan .done .n{background:var(--good);color:var(--surface)}
.pill{font-size:12px;border-radius:99px;padding:2px 10px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
/* pronunciation result */
.words{display:flex;flex-wrap:wrap;gap:6px;direction:ltr;font-family:var(--en);font-size:20px}
.words button{border:0;border-radius:8px;padding:2px 8px;background:var(--sunk)}
.words .ok{background:var(--good-soft);color:var(--good)}
.words .miss{background:var(--bad-soft);color:var(--bad);text-decoration:underline wavy}
.score{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
textarea,input[type=text]{font:inherit;font-family:var(--en);font-size:17px;direction:ltr;text-align:left;width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;background:var(--sunk);color:var(--fg);padding:10px 12px;resize:vertical}
.note{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:10px 12px}
.tip{border-inline-start:3px solid var(--warn);padding-inline-start:10px;font-size:14px}
.ipa{font-family:var(--en);direction:ltr;unicode-bidi:isolate;color:var(--accent)}
.rec.live{background:var(--bad);border-color:var(--bad);color:#fff}
/* flashcard */
.flash{min-height:180px;align-items:center;justify-content:center;text-align:center}
.flash .w{font-family:var(--en);font-size:32px;font-weight:600;direction:ltr}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;border-radius:14px;padding:10px 12px;min-width:0}
.msg.me{align-self:flex-start;background:var(--accent);color:var(--accent-ink)}
.msg.bot{align-self:flex-end;background:var(--surface);border:1px solid var(--line)}
.msg .en{font-size:17px}
.fix{font-size:13px;border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;display:flex;flex-direction:column;gap:6px}
.fix s{color:var(--bad)} .fix b{color:var(--good);font-weight:600}
/* tab bar */
nav.tabs{position:fixed;inset:auto 0 0 0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tab{border:0;background:none;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="true"]{color:var(--accent);font-weight:700}
.seg{display:flex;gap:6px;overflow-x:auto;direction:ltr;padding-bottom:2px}
.seg button{font-family:var(--en);font-weight:600;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.passage{font-family:var(--en);font-size:17px;direction:ltr;text-align:left;background:var(--sunk);border-radius:10px;padding:10px 12px}

/* video-call stage */
:root{--skin:#F1C7A5;--skin2:#E4B08B;--skin3:#C98B6B;--hair:#3A2318;--top:#2E8C87;--top2:#246F6B;--stage1:#DCE6F7;--stage2:#BCCBEB;--win:#F6F9FF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--stage1:#22305A;--stage2:#141D38;--win:#2C3B66}}
:root[data-theme="dark"]{--stage1:#22305A;--stage2:#141D38;--win:#2C3B66}
.stage{position:relative;border-radius:22px;overflow:hidden;background:radial-gradient(120% 90% at 50% 20%,var(--stage1),var(--stage2));aspect-ratio:3/4;max-height:60vh;width:100%;max-width:100%;margin-inline:auto;display:flex;align-items:flex-end;justify-content:center}
.stage .win{position:absolute;top:8%;left:9%;width:30%;height:26%;border-radius:10px;background:var(--win);opacity:.55}
.stage .win::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 48%,var(--stage2) 48% 52%,transparent 52%)}
.ava{width:92%;max-width:420px;height:auto;display:block;position:relative}
.ava .head{transform-box:view-box;transform-origin:150px 250px;animation:sway 7s ease-in-out infinite;transition:transform .5s}
.ava .body{transform-box:view-box;transform-origin:150px 340px;animation:breathe 4s ease-in-out infinite}
.ava .ey{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
.ava .iris{transition:transform .35s}
.ava .brow{transition:transform .3s}
.ava .m-open{display:none}
.stage.talking .ava .head{animation:nod 1.4s ease-in-out infinite}
.stage.mouth-open .ava .m-open{display:inline}.stage.mouth-open .ava .m-closed{display:none}
.stage.listening .ava .head{animation:none;transform:rotate(-5deg) translateY(4px)}
.stage.listening .ava .brow{transform:translateY(-4px)}
.stage.thinking .ava .iris{transform:translate(4px,-5px)}
.stage.thinking .ava .head{animation:none;transform:rotate(3deg)}
@keyframes sway{0%,100%{transform:rotate(0)}30%{transform:rotate(2deg)}70%{transform:rotate(-2deg)}}
@keyframes nod{0%,100%{transform:rotate(0) translateY(0)}25%{transform:rotate(1.5deg) translateY(2px)}60%{transform:rotate(-1.5deg) translateY(-1px)}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.012)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.stage-top{position:absolute;top:12px;inset-inline:12px;display:flex;align-items:center;gap:8px;color:#fff;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.4);z-index:2;direction:ltr}
.stage-top .live{width:9px;height:9px;border-radius:50%;background:#3DDC84;box-shadow:0 0 0 3px rgba(61,220,132,.3)}
.stage-top .tm{margin-inline-start:auto;font-variant-numeric:tabular-nums;font-weight:500}
.cap{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 14px;background:linear-gradient(transparent,rgba(10,14,30,.78));color:#fff;font-size:18px;line-height:1.4;min-height:20px;z-index:2;transition:opacity .3s}
.cap:empty{opacity:0}
.stage.nosubs .cap{display:none}
.pip{position:absolute;top:44px;right:12px;width:84px;border-radius:14px;background:rgba(10,14,30,.55);padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:3;color:#fff}
.pip-ava{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;transition:box-shadow .2s}
.stage.listening .pip-ava{box-shadow:0 0 0 4px rgba(61,220,132,.8);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(61,220,132,.25)}}
.pip span{font-size:11px}
.think{position:absolute;top:40%;right:16%;display:none;gap:5px;background:#fff;border-radius:16px;padding:8px 10px;z-index:2}
.think i{width:8px;height:8px;border-radius:50%;background:#7A86A8;animation:dot 1s infinite}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
.stage.thinking .think{display:flex}
@keyframes dot{50%{transform:translateY(-4px);opacity:.5}}
.mycap{position:absolute;top:44px;left:12px;right:108px;color:#fff;font-size:15px;background:rgba(10,14,30,.5);border-radius:12px;padding:6px 10px;z-index:2;direction:ltr;text-align:left}
.mycap:empty{display:none}
.callbar{justify-content:center;gap:18px}
.cbtn{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-weight:700;font-family:var(--en)}
.cbtn svg{width:24px;height:24px}
.cbtn[aria-pressed="false"]{opacity:.5}
.cbtn.mic{width:76px;height:76px;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cbtn.mic svg{width:34px;height:34px}
.cbtn.mic.live{background:#D64545;border-color:#D64545;color:#fff;animation:pulse2 1.2s infinite}
@keyframes pulse2{50%{box-shadow:0 0 0 10px rgba(214,69,69,.2)}}
details.card summary{cursor:pointer;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

let voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/Samantha|Jenny|Aria|Zira|female|Google US English/i.test(v.name))||vs.find(v=>/en[-_](US|GB)/i.test(v.lang))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
let nVoice;async function nativeVoice(NT){if(nVoice!==undefined)return nVoice;nVoice=null;try{const r=await NT.getSupportedVoices();const vs=(r&&r.voices)||[];
  const pref=["en-us-x-sfg","en-us-x-tpf","en-us-x-iob","en-us-x-iog","en-gb-x-gba","en-gb-x-rjs"];
  for(const p of pref){const i=vs.findIndex(v=>(v.voiceURI||v.name||"").toLowerCase().includes(p));if(i>=0){nVoice=i;break}}
  if(nVoice==null){const i=vs.findIndex(v=>/en[-_]US/i.test(v.lang)&&/female/i.test(v.name||v.voiceURI||""));if(i>=0)nVoice=i}}catch(e){}return nVoice}
function say(t,slow){return new Promise(async done=>{const NT=window.Capacitor?.Plugins?.TextToSpeech;
  if(NT){const vi=await nativeVoice(NT);NT.stop().catch(()=>{}).finally(()=>NT.speak(Object.assign({text:t,lang:"en-US",rate:slow?0.7:1,pitch:1.05,volume:1,category:"playback"},vi!=null?{voice:vi}:{})).then(done,()=>{toast("ثبّت محرك نطق جوجل من الإعدادات");done()}));return}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";if(voice)u.voice=voice;u.rate=slow?0.7:0.95;u.onend=u.onerror=()=>done();speechSynthesis.speak(u)}catch(e){toast("الجهاز ده مش بيدعم تشغيل الصوت");done()}})}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const NSR=()=>window.Capacitor?.Plugins?.SpeechRecognition;
let srBroken=!SR&&!NSR();
function listen(onPartial){
  const N=NSR();
  if(N)return (async()=>{
    const p=await N.requestPermissions().catch(()=>null);if(p&&p.speechRecognition&&p.speechRecognition!=="granted")throw"na";
    return await new Promise(async(res,rej)=>{
      let last="",done=false,silT=null,hardT=null,h1=null,h2=null;
      const finish=async()=>{if(done)return;done=true;clearTimeout(silT);clearTimeout(hardT);try{h1&&h1.remove();h2&&h2.remove()}catch(e){}try{await N.stop()}catch(e){}last?res(last):rej("empty")};
      try{h1=await N.addListener("partialResults",d=>{const t=d&&d.matches&&d.matches[0];if(t){last=t;onPartial&&onPartial(t);clearTimeout(silT);silT=setTimeout(finish,1700)}})}catch(e){}
      try{h2=await N.addListener("listeningState",d=>{if(d&&d.status==="stopped")setTimeout(finish,400)})}catch(e){}
      hardT=setTimeout(finish,20000);listen.stop=finish;
      try{const r=await N.start({language:"en-US",maxResults:1,partialResults:true,popup:false});const t=r&&r.matches&&r.matches[0];if(t){last=t;finish()}}
      catch(e){finish()}
    });
  })().catch(e=>{throw e==="na"?"na":"empty"});
  return new Promise((res,rej)=>{
  if(srBroken)return rej("na");
  let r;try{r=new SR()}catch(e){srBroken=true;return rej("na")}
  r.lang="en-US";r.interimResults=true;r.maxAlternatives=1;let final="",got=false;
  r.onresult=e=>{let t="";for(const x of e.results)t+=x[0].transcript+" ";final=t.trim();got=true;onPartial&&onPartial(final)};
  r.onerror=e=>{if(["not-allowed","service-not-allowed","audio-capture","network"].includes(e.error)){srBroken=true;rej("na")}else rej(e.error)};
  r.onend=()=>got?res(final):rej("empty");
  try{r.start()}catch(e){srBroken=true;rej("na")}
  listen.stop=()=>{try{r.stop()}catch(e){}};
})}

/* ================= SCORING ================= */
const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]+/g," ").split(/\s+/).filter(Boolean);
function align(target,heard){
  const T=norm(target),H=norm(heard),n=T.length,m=H.length;
  const sim=(a,b)=>a===b||(a.length>3&&lev(a,b)<=1);
  const d=Array.from({length:n+1},()=>Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)d[i][j]=sim(T[i],H[j])?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
  const ok=Array(n).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(sim(T[i],H[j])){ok[i]=true;i++;j++}else if(d[i+1][j]>=d[i][j+1])i++;else j++}
  const raw=target.split(/\s+/);
  return{words:raw.map((w,k)=>({w,ok:ok[k]??false,n:T[k]})),score:n?Math.round(ok.filter(Boolean).length/n*100):0};
}
function lev(a,b){const d=Array.from({length:a.length+1},(_, i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function tipsFor(missed){
  const t=new Set();
  for(const w of missed){
    if(/th/.test(w))t.add(["th","<span class='ipa'>/θ/ /ð/</span> طلّع طرف لسانك بين سنانك وانفخ: think = ثِنك، this = ذِس. مش «سينك» ولا «زيس»."]);
    if(/p/.test(w))t.add(["p","<span class='ipa'>/p/</span> زي الباء بس من غير صوت في الزور ومع دفعة هوا. جرّب تحط ورقة قدام بقك، لازم تتحرك مع p."]);
    if(/v/.test(w))t.add(["v","<span class='ipa'>/v/</span> سنانك اللي فوق على شفتك اللي تحت مع صوت. مش f (من غير صوت) ومش b."]);
    if(/ed$/.test(w))t.add(["ed","نهاية <b>ed</b>: بتتنطق /t/ بعد صوت مكتوم (walked = ووكت)، و/d/ بعد صوت مجهور (played)، و/ɪd/ بعد t أو d بس (wanted)."]);
    if(/^(str|spr|spl|sch|sk|sp|st)/.test(w))t.add(["cl","كلمات بتبدأ بحرفين ساكنين زي <span class='en'>street, speak</span>: ما تحطش «إ» قبلها (مش إستريت). ابدأ بالـ s على طول."]);
    if(/(ng)$/.test(w))t.add(["ng","<span class='ipa'>/ŋ/</span> في آخر الكلمة (-ing): الصوت يخرج من الأنف، وما تنطقش g واضحة في الآخر."]);
    if(/[aeiou]{2}|o$|ou/.test(w)&&t.size<3)t.add(["vw","حروف العلة الإنجليزي أطول وأوضح من العربي. اسمع الكلمة ببطء وقلّد طول الصوت."]);
  }
  return [...t].slice(0,3).map(x=>x[1]);
}

function speakBox(target,onScore){
  const id="sb"+Math.random().toString(36).slice(2,7);
  const html=`<div class="stack" id="${id}">
    <div class="row"><button class="btn" data-a="hear">${IC.play}اسمع</button><button class="btn" data-a="slow">${IC.slow}ببطء</button><button class="btn primary rec" data-a="rec" ${srBroken?"hidden":""}>${IC.mic}سجّل صوتك</button></div>
    <div class="note" data-live hidden></div>
    <div class="stack" data-dict ${srBroken?"":"hidden"}>
      <p class="note">اضغط في المربع، وبعدين اضغط زرار <b>المايك اللي في الكيبورد</b> واقرأ الجملة بصوت عالي. الكيبورد هيكتب اللي فهمه من نطقك، والتطبيق هيقارنه بالجملة الصح.</p>
      <label class="label" for="${id}t">اللي اتسمع من صوتك</label>
      <textarea id="${id}t" rows="2" placeholder="Tap the keyboard mic and read…"></textarea>
      <div class="row end"><button class="btn primary" data-a="check">صحّح نطقي</button></div>
    </div>
    <div data-out></div></div>`;
  setTimeout(()=>{
    const el=document.getElementById(id);if(!el)return;
    const live=el.querySelector("[data-live]"),out=el.querySelector("[data-out]"),dict=el.querySelector("[data-dict]"),rec=el.querySelector("[data-a=rec]");
    el.querySelector("[data-a=hear]").onclick=()=>say(target);
    el.querySelector("[data-a=slow]").onclick=()=>say(target,true);
    const show=heard=>{const r=align(target,heard);const missed=r.words.filter(w=>!w.ok).map(w=>w.n).filter(Boolean);
      const tone=r.score>=85?"good":r.score>=60?"warn":"bad";const msg=r.score>=85?"ممتاز، نطقك واضح":r.score>=60?"كويس، فيه كلمات محتاجة شغل":"محتاج تعيد ببطء";
      out.innerHTML=`<div class="card" style="background:var(--sunk);border:0">
        <div class="row" style="justify-content:space-between"><div><div class="score" style="color:var(--${tone})">${r.score}%</div><div class="muted" style="font-size:13px">${msg}</div></div><span class="pill ${tone}">${missed.length?missed.length+" كلمة محتاجة تصحيح":"كل الكلمات صح"}</span></div>
        <div class="words">${r.words.map(w=>`<button class="${w.ok?"ok":"miss"}" data-w="${esc(w.n||w.w)}" aria-label="اسمع ${esc(w.w)}">${esc(w.w)}</button>`).join("")}</div>
        <p class="muted" style="font-size:13px">اللي اتسمع: <span class="en">${esc(heard||"—")}</span></p>
        ${missed.length?`<p class="muted" style="font-size:13px">اضغط على أي كلمة حمرا عشان تسمع نطقها الصح وتعيدها.</p>`:""}
        ${tipsFor(missed).map(t=>`<p class="tip">${t}</p>`).join("")}</div>`;
      out.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>say(b.dataset.w,true));
      onScore&&onScore(r.score);};
    el.querySelector("[data-a=check]").onclick=()=>{const v=el.querySelector("textarea").value.trim();if(!v)return toast("اقرأ الجملة الأول عشان يتكتب كلامك");show(v)};
    rec.onclick=async()=>{
      if(rec.classList.contains("live")){listen.stop&&listen.stop();return}
      rec.classList.add("live");rec.innerHTML=IC.mic+"وقّف";live.hidden=false;live.textContent="بسمعك… اقرأ الجملة";
      try{const t=await listen(p=>live.innerHTML='<span class="en">'+esc(p)+'</span>');live.hidden=true;show(t)}
      catch(e){live.hidden=true;if(e==="na"){rec.hidden=true;dict.hidden=false;toast("التسجيل المباشر مش متاح هنا، استخدم مايك الكيبورد")}else toast("ما سمعتش حاجة، جرّب تاني وقرّب الموبايل")}
      finally{rec.classList.remove("live");rec.innerHTML=IC.mic+"سجّل صوتك"}};
  });
  return html;
}

function pickQ(){for(let d=0;d<6;d++)for(const L of [T.cur+d,T.cur-d]){if(L<0||L>5)continue;const c=TEST.map((q,k)=>[q,k]).filter(([q,k])=>q.lv===L&&!T.used.has(k));if(c.length)return c[Math.floor(Math.random()*c.length)]}return null}
function nextQ(){
  if(T.i>=T.N){T.stage="speak";T.si=0;return speakStage()}
  const p=pickQ();if(!p){T.stage="speak";T.si=0;return speakStage()}
  const[q,k]=p;T.used.add(k);T.q=q;
  const order=q.o.map((o,i)=>i).sort(()=>Math.random()-.5);
  V.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><span class="label">اختبار المستوى · سؤال ${T.i+1} من ${T.N}</span><span class="pill">${SK[q.sk]}</span></div>
   <div class="prog"><i style="width:${T.i/(T.N+3)*100}%"></i></div>
   ${q.p?`<div class="passage">${esc(q.p)}</div>`:""}
   ${q.say?`<p>اسمع الجملة واختار اللي سمعته بالظبط${q.lv>=4?" أو معناها":""}.</p><div class="row"><button class="btn primary" id="pl">${IC.play}شغّل الجملة</button><button class="btn" id="pls">${IC.slow}ببطء</button></div>`:`<p class="big-en">${esc(q.q)}</p>`}
   ${q.p?`<p class="en" style="font-size:17px;font-weight:600">${esc(q.q)}</p>`:""}
   <div class="opts">${order.map(i=>`<button class="opt" data-i="${i}">${esc(q.o[i])}</button>`).join("")}</div>
   <button class="btn ghost" id="idk">مش عارف</button></div>`;
  if(q.say){$("#pl").onclick=()=>say(q.say);$("#pls").onclick=()=>say(q.say,true)}
  const answer=i=>{const ok=i===q.a;T.ans.push({lv:q.lv,sk:q.sk,ok});T.cur=ok?Math.min(5,T.cur+1):Math.max(0,T.cur-1);T.i++;
    V.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(+b.dataset.i===q.a)b.classList.add("right");else if(+b.dataset.i===i)b.classList.add("wrong")});
    setTimeout(nextQ,ok?450:900)};
  V.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));$("#idk").onclick=()=>answer(-1);
}
const SPK=[[1,"Could you speak a little slower, please?"],[2,"I've been working here for almost three years."],[4,"It's worth bearing in mind that maintenance costs tend to accumulate."]];
function speakStage(){
  if(T.si>=SPK.length)return finishTest();
  const [lv,s]=SPK[T.si];
  V.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><span class="label">جزء النطق · ${T.si+1} من 3</span><span class="pill">${SK.s}</span></div>
   <div class="prog"><i style="width:${(T.N+T.si)/(T.N+3)*100}%"></i></div>
   <p>اقرأ الجملة دي بصوت عالي. ممكن تسمعها الأول.</p><p class="big-en">${esc(s)}</p>
   ${speakBox(s,sc=>{T.sp[T.si]=sc;$("#nx").disabled=false})}
   <div class="row end"><button class="btn" id="sk">تخطّى</button><button class="btn primary" id="nx" disabled>التالي</button></div></div>`;
  $("#nx").onclick=()=>{T.si++;speakStage()};$("#sk").onclick=()=>{T.sp[T.si]=null;T.si++;speakStage()};
}
function finishTest(){
  const by=LV.map(()=>({n:0,c:0}));T.ans.forEach(a=>{by[a.lv].n++;if(a.ok)by[a.lv].c++});
  let lvl=0;for(let L=0;L<6;L++){if(by[L].n>=2&&by[L].c/by[L].n>=0.6)lvl=L}
  const skills={};for(const k of ["g","v","r","l"]){const xs=T.ans.filter(a=>a.sk===k);
    skills[k]=xs.length?Math.round(xs.reduce((s,a)=>s+(a.ok?(a.lv+1):0),0)/xs.reduce((s,a)=>s+(a.lv+1),0)*100):null}
  const sp=T.sp.filter(x=>x!=null);skills.s=sp.length?Math.round(sp.reduce((a,b)=>a+b,0)/sp.length):null;
  S.level=lvl;S.work=null;S.skills=skills;S.testDate=Date.now();save();T=null;setChip();
  showResult();
}
function weakest(){if(!S.skills)return[];return Object.entries(S.skills).filter(([k,v])=>v!=null).sort((a,b)=>a[1]-b[1]).map(([k])=>k)}
function showResult(){
  const L=S.level;
  V.innerHTML=`<div class="card"><span class="label">نتيجة اختبار المستوى</span>
    <div class="row" style="gap:14px"><div class="lvchip" style="font-size:28px;padding:8px 18px">${LV[L]}</div><div><h2>${LVNAME[L]}</h2><p class="muted">${DESC[L]}</p></div></div>
    ${cefrBar()}${skillBars()}
    <p>هنبدأ معاك من مستوى <b class="en">${LV[L]}</b>، مع تركيز أكتر على <b>${weakest().slice(0,2).map(k=>SK[k]).join(" و")}</b>.</p>
    <button class="btn primary" id="go">شوف خطتك</button></div>`;
  $("#go").onclick=()=>go("home");
}
const DESC=["بتفهم جمل بسيطة جدًا وكلمات يومية.","بتتعامل في مواقف يومية بسيطة زي الشراء والسؤال عن الطريق.","بتتكلم في مواضيع مألوفة وبتفهم الفكرة الأساسية.","بتتكلم بطلاقة معقولة وبتفهم نصوص ومناقشات أعقد.","بتعبّر بمرونة ودقة في الشغل والدراسة.","قريب جدًا من مستوى المتحدث الأصلي."];
function cefrBar(){return `<div class="cefr" aria-label="مقياس المستويات">${LV.map((l,i)=>`<span class="${i===S.level?"cur":i<S.level?"on":""}">${l}</span>`).join("")}</div>`}
function skillBars(){if(!S.skills)return"";return `<div class="skills">${Object.keys(SK).map(k=>{const v=S.skills[k];const c=v==null?"var(--line)":v>=70?"var(--good)":v>=45?"var(--warn)":"var(--bad)";
  return `<span>${SK[k]}</span><div class="bar"><i style="width:${v??0}%;background:${c}"></i></div><span class="muted" style="font-size:13px">${v==null?"لم يُقس":v+"%"}</span>`}).join("")}</div>`}

  const pr=PRON[L].map(s=>S.pron[s]).filter(x=>x!=null);const pavg=pr.length?Math.round(pr.reduce((a,b)=>a+b,0)/pr.length):null;
  return{g,voc,pr:pr.length,pavg};

     <div class="row"><button class="btn" id="hw">${IC.play}اسمعها</button></div>
     ${vshow?`<p style="font-size:20px;font-weight:700">${esc(ar)}</p><p class="en" style="font-size:17px">${esc(ex)}</p><button class="btn ghost" id="he">${IC.play}اسمع المثال</button>`:`<button class="btn primary" id="rv">اكشف المعنى</button>`}</div>

}

    V.innerHTML=`<div class="card"><span class="label">مستوى التدريب</span>${levelSeg()}</div>
     <div class="card"><span class="label">درس مستوى ${LV[L]}</span><h2 class="en" style="text-align:right">${esc(les.t)}</h2><p>${les.ex}</p>

    bindSeg(()=>{G=null;gram()});$("#sg").onclick=()=>{G.i=0;G.c=0;gram()};return}
  if(G.i>=les.qs.length){const pc=Math.round(G.c/les.qs.length*100);S.gram[L]=Math.max(pc,S.gram[L]??0);save();
    V.innerHTML=`<div class="card"><h3>النتيجة</h3><div class="score" style="color:var(--${pc>=80?"good":pc>=60?"warn":"bad"})">${pc}%</div><p class="muted">${pc>=80?"ممتاز، الدرس ده اتقفل.":"اقرا الشرح تاني وجرب مرة كمان، محتاج 80% عشان الخطوة تتقفل."}</p>

  V.innerHTML=`<div class="card"><span class="label">${esc(les.t)} · ${G.i+1}/${les.qs.length}</span><div class="prog"><i style="width:${G.i/les.qs.length*100}%"></i></div>

  V.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,ok=i===a;if(ok)G.c++;
    V.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.i===a)x.classList.add("right");else if(+x.dataset.i===i)x.classList.add("wrong")});
    const full=q.replace("___",o[a]);

    $("#hs").onclick=()=>say(full);$("#gn").onclick=()=>{G.i++;gram()}});

const LLM=()=>window.Capacitor?.Plugins?.LocalLlm;
let llmReady=null;
function llmLoad(){if(!llmReady)llmReady=LLM().load().catch(e=>{llmReady=null;throw e});return llmReady}
async function localGen(prompt){await llmLoad();const r=await LLM().generate({prompt});return String(r?.text||"").trim()}
function cleanReply(t,name){t=t.replace(/<[^>]+>/g,"").replace(/\*+/g,"").replace(/^\s*(\w+)\s*:\s*/,"").replace(/^["“]|["”]$/g,"").replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,"").trim();
  const parts=t.split(/(?<=[.!?])\s+/).filter(Boolean);return parts.slice(0,3).join(" ")}
async function localFriend(meIdx){
  const f=FS(),L=W();const hist=f.msgs.slice(-8).map(m=>(m.r==="me"?"Osama: ":f.name+": ")+m.t).join("\n");
  const lvl=L<2?"very simple English with short common words":L<4?"simple everyday English":"natural everyday English";
  const replyP=`You are ${f.name}, a cheerful, kind young woman and Osama's close friend; you are on a video call. Osama is Egyptian, lives in Dubai and is practising English with you. Talk like a warm, funny friend on a phone call, in ${lvl}. Reply in 1 or 2 short sentences, react to what he said, and end with one simple question. Write only ${f.name}'s words.
${f.facts.length?"You know about him: "+f.facts.slice(-8).join("; ")+".\n":""}${meIdx==null?`Start the conversation: greet him and ask how his day is going.`:`Conversation:\n${hist}\n${f.name}:`}`;
  const reply=cleanReply(await localGen(replyP),f.name)||"That's cool! Tell me more?";
  return{reply,me:meIdx};
}
async function localFix(text){
  const c=await localGen(`Correct the grammar of this English sentence so it sounds natural. Write only the corrected sentence, nothing else.\nSentence: ${text}\nCorrected:`);
  let better=c.split("\n").map(x=>x.trim()).filter(Boolean)[0]||"";better=better.replace(/^(corrected( sentence)?\s*:\s*)/i,"").replace(/^["“]|["”]$/g,"").trim();
  if(!better)return[];const a=norm(text).join(" "),b=norm(better).join(" ");
  if(a===b||norm(better).length>norm(text).length*2+3)return[];
  return[{you:text,better,why:""}];
}
const MODEL_URL="https://github.com/bunyanrealstate-commits/bunyan/releases/download/english-model/gemma3-1b-it-int4.task";

function gemKey(){try{return localStorage.getItem("ec-gem")||""}catch(e){return""}}
async function ask(prompt){
  if(sampler)return sampler.json(prompt,{modelTier:"quick",cache:false});
  const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key="+encodeURIComponent(gemKey()),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:"application/json",temperature:0.9}})});
  if(r.status===400||r.status===403){try{localStorage.removeItem("ec-gem")}catch(e){}throw{code:"bad_key"}}
  if(r.status===429)throw{code:"rate_limited"};
  if(!r.ok)throw{code:"upstream"};
  const j=await r.json();const t=j?.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("")||"";
  return JSON.parse(t.slice(t.indexOf("{"),t.lastIndexOf("}")+1));
}
