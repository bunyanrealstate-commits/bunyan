name: bunyan
description: بنيان — إدارة الوحدات المفروشة
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  crypto: ^3.0.5
  printing: ^5.13.2
  share_plus: ^10.1.4
  html: ^0.15.4
  pdf: ^3.11.1
  flutter_svg: ^2.0.10+1
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.1
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
    - assets/hq.json
  fonts:
    - family: Plex
      fonts:
        - asset: fonts/PlexArabic-500.ttf
        - asset: fonts/PlexArabic-600.ttf
          weight: 600
        - asset: fonts/PlexArabic-700.ttf
          weight: 700
